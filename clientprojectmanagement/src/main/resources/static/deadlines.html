<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var r=localStorage.getItem('user');if(!r){window.location.replace('login.html');return;}var u=JSON.parse(r);if(u.role==='admin')window.location.replace('Admin.html');if(u.role==='developer')window.location.replace('MyTasks.html');})();</script>
    <script src="auth.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlines — ProjectHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.12);--bg:#0d0f1a;--bg-card:rgba(255,255,255,0.04);--bg-hover:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.08);--border-hover:rgba(0,212,255,0.3);--text-primary:#eef0ff;--text-secondary:rgba(200,210,240,0.55);--text-muted:rgba(200,210,240,0.3);--green:#22c97a;--amber:#f5a623;--red:#ff5e5e;--sidebar-w:240px}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text-primary);display:flex}
        body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 60% at 5% 40%,rgba(0,100,180,0.14) 0%,transparent 65%);pointer-events:none}
        body::after{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:rgba(10,13,28,0.9);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 20px;z-index:10;backdrop-filter:blur(12px)}
        .sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:40px}
        .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--cyan),#4facfe);border-radius:8px;display:flex;align-items:center;justify-content:center}
        .brand-icon svg{width:18px;height:18px}
        .brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text-primary)}
        .nav-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin-bottom:8px}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);transition:all 0.2s;margin-bottom:2px;text-decoration:none}
        .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.7}
        .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text-primary)}
        .nav-item.active{background:var(--cyan-dim);color:var(--cyan);font-weight:500}
        .nav-item.active svg{opacity:1}
        .nav-item.danger{color:var(--red)}
        .nav-item.danger:hover{background:rgba(255,94,94,0.1)}
        .sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:20px}
        .user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:8px}
        .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#00bfdf,#4facfe);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:#001830;flex-shrink:0}
        .user-name-text{font-size:13px;font-weight:500;color:var(--text-primary)}
        .user-role-text{font-size:11px;color:var(--text-muted)}
        .main{margin-left:var(--sidebar-w);flex:1;position:relative;z-index:1;padding:40px 44px}
        .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;animation:rise 0.6s cubic-bezier(0.22,1,0.36,1) both}
        .page-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
        .page-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.6px;color:var(--text-primary)}
        .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px;animation:rise 0.6s 0.06s cubic-bezier(0.22,1,0.36,1) both}
        .sum-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:14px}
        .sum-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .sum-icon svg{width:17px;height:17px}
        .sum-icon.red{background:rgba(255,94,94,0.12);color:var(--red)}
        .sum-icon.amber{background:rgba(245,166,35,0.12);color:var(--amber)}
        .sum-icon.cyan{background:rgba(0,212,255,0.12);color:var(--cyan)}
        .sum-val{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;color:var(--text-primary);line-height:1}
        .sum-lbl{font-size:12px;color:var(--text-secondary);margin-top:2px}
        .timeline{animation:rise 0.6s 0.12s cubic-bezier(0.22,1,0.36,1) both}
        .month-group{margin-bottom:32px}
        .month-label{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;padding-left:4px}
        .deadline-row{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:all 0.22s;text-decoration:none}
        .deadline-row:hover{border-color:var(--border-hover);background:var(--bg-hover);transform:translateX(4px)}
        .date-block{width:52px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
        .date-block.overdue{background:rgba(255,94,94,0.12);border:1px solid rgba(255,94,94,0.2)}
        .date-block.critical{background:rgba(245,166,35,0.12);border:1px solid rgba(245,166,35,0.2)}
        .date-block.upcoming{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.15)}
        .date-block.done{background:rgba(34,201,122,0.1);border:1px solid rgba(34,201,122,0.15)}
        .date-day{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;line-height:1}
        .date-mon{font-size:10px;letter-spacing:0.06em;text-transform:uppercase}
        .date-block.overdue .date-day,.date-block.overdue .date-mon{color:var(--red)}
        .date-block.critical .date-day,.date-block.critical .date-mon{color:var(--amber)}
        .date-block.upcoming .date-day,.date-block.upcoming .date-mon{color:var(--cyan)}
        .date-block.done .date-day,.date-block.done .date-mon{color:var(--green)}
        .dl-info{flex:1;min-width:0}
        .dl-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text-primary)}
        .dl-desc{font-size:12px;color:var(--text-muted);margin-top:3px}
        .days-pill{font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;flex-shrink:0}
        .days-pill.overdue{background:rgba(255,94,94,0.12);color:var(--red);border:1px solid rgba(255,94,94,0.2)}
        .days-pill.critical{background:rgba(245,166,35,0.12);color:var(--amber);border:1px solid rgba(245,166,35,0.2)}
        .days-pill.upcoming{background:rgba(0,212,255,0.1);color:var(--cyan);border:1px solid rgba(0,212,255,0.15)}
        .days-pill.done{background:rgba(34,201,122,0.1);color:var(--green);border:1px solid rgba(34,201,122,0.15)}
        .empty{padding:60px 20px;text-align:center;color:var(--text-muted);font-size:13px}
        @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:24px 20px}.summary{grid-template-columns:1fr 1fr}}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <p class="nav-label">Menu</p>
    <a class="nav-item" href="index.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</a>
    <a class="nav-item" href="MyProjects.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>My Projects</a>
    <a class="nav-item active" href="deadlines.html"><svg viewBox="0 0 16 16" fill="none"><path d="M8 1v6l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/></svg>Deadlines</a>
    <a class="nav-item" href="Messages.html"><svg viewBox="0 0 16 16" fill="none"><path d="M14 10.667c0 .344-.077.683-.226.995a2.59 2.59 0 01-.627.845c-.38.344-.793.516-1.214.516-.306 0-.638-.09-.99-.272L8 10.667l-2.943 2.084c-.352.181-.684.272-.99.272-.421 0-.835-.172-1.214-.516a2.59 2.59 0 01-.627-.845A2.432 2.432 0 012 10.667V4a2 2 0 012-2h8a2 2 0 012 2v6.667z" stroke="currentColor" stroke-width="1.4"/></svg>Messages</a>
    <a class="nav-item" href="ClientChat.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 2h12v10H9l-3 3v-3H2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Chat with Admin</a>
    <a class="nav-item" href="Profile.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Profile</a>
    <div class="sidebar-bottom">
        <div class="user-pill"><div class="avatar" id="sb-avatar">?</div><div><div class="user-name-text" id="sb-name">…</div><div class="user-role-text">client</div></div></div>
        <a class="nav-item danger" href="#" onclick="doLogout()"><svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div><p class="page-eyebrow">Schedule</p><h1 class="page-title">Deadlines</h1></div>
    </div>
    <div class="summary">
        <div class="sum-card"><div class="sum-icon red"><svg viewBox="0 0 17 17" fill="none"><circle cx="8.5" cy="8.5" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 5v4M8.5 11.5v.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><div><div class="sum-val" id="s-overdue">—</div><div class="sum-lbl">Overdue</div></div></div>
        <div class="sum-card"><div class="sum-icon amber"><svg viewBox="0 0 17 17" fill="none"><circle cx="8.5" cy="8.5" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 4.5v5l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div><div><div class="sum-val" id="s-critical">—</div><div class="sum-lbl">Due in 2 Weeks</div></div></div>
        <div class="sum-card"><div class="sum-icon cyan"><svg viewBox="0 0 17 17" fill="none"><rect x="2" y="3" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 2v2M12 2v2M2 7h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div><div><div class="sum-val" id="s-upcoming">—</div><div class="sum-lbl">Upcoming</div></div></div>
    </div>
    <div class="timeline" id="timeline"></div>
</main>
<script>
    var user = JSON.parse(localStorage.getItem('user'));
    function doLogout(){ localStorage.removeItem('user'); localStorage.removeItem('token'); window.location.replace('login.html'); }
    function initials(n){ if(!n)return'?'; return n.trim().split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
    function daysUntil(d){ if(!d)return null; return Math.ceil((new Date(d)-new Date())/86400000); }
    function urgency(days,status){
        if((status||'').toLowerCase()==='completed') return 'done';
        if(days<0)   return 'overdue';
        if(days<=14) return 'critical';
        return 'upcoming';
    }
    function daysLabel(days,status){
        if((status||'').toLowerCase()==='completed') return '✓ Completed';
        if(days<0)   return Math.abs(days)+'d overdue';
        if(days===0) return 'Due today!';
        return days+'d left';
    }

    document.getElementById('sb-name').textContent   = user.name||'Client';
    document.getElementById('sb-avatar').textContent = initials(user.name);

    authFetch('/clients/'+user.id+'/projects')
        .then(function(r){return r.json();})
        .then(function(projects){
            var sorted = projects.slice().sort(function(a,b){return new Date(a.deadline)-new Date(b.deadline);});
            var overdue=0,critical=0,upcoming=0;
            sorted.forEach(function(p){
                var days=daysUntil(p.deadline);
                var u=urgency(days,p.status);
                if(u==='overdue')  overdue++;
                else if(u==='critical') critical++;
                else if(u==='upcoming') upcoming++;
            });
            document.getElementById('s-overdue').textContent  = overdue;
            document.getElementById('s-critical').textContent = critical;
            document.getElementById('s-upcoming').textContent = upcoming;

            // Group by month
            var groups={};
            sorted.forEach(function(p){
                var d=new Date(p.deadline);
                var key=d.toLocaleString('en-GB',{month:'long',year:'numeric'});
                if(!groups[key]) groups[key]=[];
                groups[key].push(p);
            });

            var tl=document.getElementById('timeline');
            if(!sorted.length){ tl.innerHTML='<div class="empty">No projects assigned yet.</div>'; return; }

            tl.innerHTML = Object.keys(groups).map(function(month){
                var rows = groups[month].map(function(p){
                    var d    = new Date(p.deadline);
                    var days = daysUntil(p.deadline);
                    var u    = urgency(days,p.status);
                    var dl   = daysLabel(days,p.status);
                    return '<a class="deadline-row" href="Project.html?id='+p.id+'">'
                        +'<div class="date-block '+u+'"><span class="date-day">'+d.getDate()+'</span>'
                        +'<span class="date-mon">'+d.toLocaleString('en-GB',{month:'short'})+'</span></div>'
                        +'<div class="dl-info"><div class="dl-title">'+p.title+'</div>'
                        +'<div class="dl-desc">Status: '+(p.status||'active')+' · Click to view</div></div>'
                        +'<span class="days-pill '+u+'">'+dl+'</span></a>';
                }).join('');
                return '<div class="month-group"><div class="month-label">'+month+'</div>'+rows+'</div>';
            }).join('');
        })
        .catch(function(){ document.getElementById('timeline').innerHTML='<div class="empty">Failed to load deadlines.</div>'; });
</script>
</body>
</html>

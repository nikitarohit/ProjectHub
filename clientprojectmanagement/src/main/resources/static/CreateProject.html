<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var r=localStorage.getItem('user');if(!r){window.location.replace('login.html');return;}var u=JSON.parse(r);if(u.role!=='admin')window.location.replace('index.html');})();</script>
    <script src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project — ProjectHub Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cyan:#00d4ff; --cyan-dim:rgba(0,212,255,0.12);
            --bg:#0d0f1a; --bg-card:rgba(255,255,255,0.04);
            --border:rgba(255,255,255,0.08); --border-focus:rgba(0,212,255,0.5);
            --text-primary:#eef0ff; --text-secondary:rgba(200,210,240,0.55); --text-muted:rgba(200,210,240,0.3);
            --green:#22c97a; --amber:#f5a623; --red:#ff5e5e; --purple:#a78bfa; --sidebar-w:240px;
        }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); min-height:100vh; color:var(--text-primary); display:flex; }
        body::before { content:''; position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse 50% 60% at 5% 40%,rgba(80,0,180,0.1) 0%,transparent 65%); pointer-events:none; }
        body::after  { content:''; position:fixed; inset:0; z-index:0; background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px); background-size:48px 48px; pointer-events:none; }

        .sidebar { position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w); background:rgba(10,13,28,0.92); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:28px 20px; z-index:10; backdrop-filter:blur(12px); }
        .sidebar-brand { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
        .brand-icon { width:34px; height:34px; background:linear-gradient(135deg,var(--cyan),#4facfe); border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .brand-icon svg { width:18px; height:18px; }
        .brand-name { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; color:var(--text-primary); }
        .admin-chip { font-size:9px; background:rgba(167,139,250,0.15); color:var(--purple); border:1px solid rgba(167,139,250,0.25); padding:2px 8px; border-radius:10px; font-weight:700; letter-spacing:0.08em; display:inline-block; margin-left:44px; margin-bottom:28px; }
        .nav-label { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-muted); padding:0 8px; margin-bottom:8px; }
        .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; font-size:13.5px; color:var(--text-secondary); transition:all 0.2s; margin-bottom:2px; text-decoration:none; }
        .nav-item svg { width:16px; height:16px; flex-shrink:0; opacity:0.7; }
        .nav-item:hover { background:rgba(255,255,255,0.05); color:var(--text-primary); }
        .nav-item.active { background:var(--cyan-dim); color:var(--cyan); font-weight:500; }
        .nav-item.active svg { opacity:1; }
        .nav-item.danger { color:var(--red); }
        .nav-item.danger:hover { background:rgba(255,94,94,0.1); }
        .sidebar-bottom { margin-top:auto; border-top:1px solid var(--border); padding-top:18px; }
        .user-pill { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid var(--border); margin-bottom:8px; }
        .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#a78bfa,#7c3aed); display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-size:12px; font-weight:700; color:white; flex-shrink:0; }
        .user-name-text { font-size:13px; font-weight:500; color:var(--text-primary); }
        .user-role-text { font-size:11px; color:var(--purple); }

        .main { margin-left:var(--sidebar-w); flex:1; position:relative; z-index:1; padding:40px 44px; }
        .topbar { display:flex; align-items:center; gap:14px; margin-bottom:32px; animation:rise 0.6s cubic-bezier(0.22,1,0.36,1) both; }
        .back-btn { display:flex; align-items:center; justify-content:center; width:36px; height:36px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:10px; color:var(--text-secondary); text-decoration:none; transition:all 0.2s; flex-shrink:0; }
        .back-btn:hover { border-color:var(--cyan-dim); color:var(--cyan); }
        .back-btn svg { width:16px; height:16px; }
        .page-eyebrow { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--cyan); margin-bottom:4px; }
        .page-title { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; color:var(--text-primary); }

        /* FORM CARD */
        .form-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:32px; max-width:640px; animation:rise 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both; position:relative; overflow:hidden; }
        .form-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--cyan),#4facfe); }

        .section-title { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; color:var(--text-primary); margin-bottom:20px; padding-bottom:10px; border-bottom:1px solid var(--border); }

        .field { display:flex; flex-direction:column; gap:7px; margin-bottom:20px; }
        .field-label { font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-muted); }
        .field-wrap { position:relative; }
        .field-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-muted); pointer-events:none; transition:color 0.2s; }
        .field-wrap:focus-within .field-icon { color:var(--cyan); }
        .field-wrap input,
        .field-wrap select,
        .field-wrap textarea { width:100%; padding:12px 14px 12px 40px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px; color:var(--text-primary); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; transition:all 0.22s; }
        .field-wrap textarea { padding-top:12px; resize:vertical; min-height:90px; }
        .field-wrap select { cursor:pointer; -webkit-appearance:none; appearance:none; }
        .field-wrap select option { background:#1a1d2e; color:var(--text-primary); }
        .field-wrap input::placeholder,
        .field-wrap textarea::placeholder { color:var(--text-muted); }
        .field-wrap input:focus,
        .field-wrap select:focus,
        .field-wrap textarea:focus { border-color:var(--border-focus); background:rgba(0,212,255,0.04); box-shadow:0 0 0 3px rgba(0,212,255,0.08); }

        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }

        /* Banners */
        .banner { border-radius:10px; padding:12px 16px; font-size:13px; margin-bottom:16px; display:none; }
        .banner.show { display:block; }
        .banner.error   { background:rgba(255,94,94,0.1);  border:1px solid rgba(255,94,94,0.3);  color:var(--red); }
        .banner.success { background:rgba(34,201,122,0.1); border:1px solid rgba(34,201,122,0.3); color:var(--green); }

        .btn { padding:13px 32px; background:linear-gradient(135deg,#00bfdf,#4facfe); border:none; border-radius:10px; color:#001830; font-family:'Syne',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.22s; position:relative; overflow:hidden; }
        .btn::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.18),transparent 60%); }
        .btn span { position:relative; z-index:1; }
        .btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,212,255,0.4); }
        .btn:disabled { opacity:0.55; cursor:not-allowed; transform:none; }

        @keyframes rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
        @media (max-width:900px) { .sidebar{display:none} .main{margin-left:0;padding:24px 20px} .form-grid{grid-template-columns:1fr} }
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <span class="admin-chip">ADMIN PANEL</span>
    <p class="nav-label">Admin</p>
    <a class="nav-item" href="Admin.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</a>
    <a class="nav-item" href="AllProjects.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>All Projects</a>
    <a class="nav-item" href="TaskBoard.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="6" y="1" width="4" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="1" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>Task Board</a>
    <a class="nav-item" href="Clients.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Clients</a>
    <a class="nav-item" href="AdminMessages.html"><svg viewBox="0 0 16 16" fill="none"><path d="M14 10.667c0 .344-.077.683-.226.995a2.59 2.59 0 01-.627.845c-.38.344-.793.516-1.214.516-.306 0-.638-.09-.99-.272L8 10.667l-2.943 2.084c-.352.181-.684.272-.99.272-.421 0-.835-.172-1.214-.516a2.59 2.59 0 01-.627-.845A2.432 2.432 0 012 10.667V4a2 2 0 012-2h8a2 2 0 012 2v6.667z" stroke="currentColor" stroke-width="1.4"/></svg>Messages</a>
    <a class="nav-item active" href="CreateProject.html"><svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Create Project</a>
    <div class="sidebar-bottom">
        <div class="user-pill"><div class="avatar" id="sb-avatar">AD</div><div><div class="user-name-text" id="sb-user-name">Admin</div><div class="user-role-text" id="sb-user-role">admin</div></div></div>
        <a class="nav-item danger" href="#" onclick="logout()"><svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <a class="back-btn" href="Admin.html"><svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <div><p class="page-eyebrow">Admin</p><h1 class="page-title">Create New Project</h1></div>
    </div>

    <div class="form-card">
        <div class="section-title">Project Details</div>

        <div class="banner error"   id="err-banner"></div>
        <div class="banner success" id="ok-banner"></div>

        <!-- Title -->
        <div class="field">
            <label class="field-label">Project Title *</label>
            <div class="field-wrap">
                <svg class="field-icon" viewBox="0 0 15 15" fill="none"><rect x="1" y="2" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M4 6h7M4 9h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                <input type="text" id="f-title" placeholder="e.g. Website Redesign">
            </div>
        </div>

        <!-- Description -->
        <div class="field">
            <label class="field-label">Description</label>
            <div class="field-wrap">
                <svg class="field-icon" viewBox="0 0 15 15" fill="none" style="top:16px;transform:none;"><path d="M2 3h11M2 6h11M2 9h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                <textarea id="f-desc" placeholder="Brief description of the project…"></textarea>
            </div>
        </div>

        <div class="form-grid">
            <!-- Status -->
            <div class="field">
                <label class="field-label">Status *</label>
                <div class="field-wrap">
                    <svg class="field-icon" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 7.5l2 2 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <select id="f-status">
                        <option value="active">Active</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>

            <!-- Deadline -->
            <div class="field">
                <label class="field-label">Deadline *</label>
                <div class="field-wrap">
                    <svg class="field-icon" viewBox="0 0 15 15" fill="none"><rect x="1" y="2" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M5 1v2M10 1v2M1 6h13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    <input type="date" id="f-deadline" style="padding-left:40px;">
                </div>
            </div>
        </div>

        <!-- Assign to client -->
        <div class="field">
            <label class="field-label">Assign to Client *</label>
            <div class="field-wrap">
                <svg class="field-icon" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 13c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                <select id="f-client">
                    <option value="">Loading clients…</option>
                </select>
            </div>
        </div>

        <button class="btn" id="create-btn" onclick="createProject()">
            <span id="create-btn-text">Create Project →</span>
        </button>
    </div>
</main>

<script>
    const user = requireAdmin();
    if (user) { fillSidebarUser(user); document.getElementById('sb-user-role').style.color='var(--purple)'; }

    // Set min date to today
    document.getElementById('f-deadline').min = new Date().toISOString().split('T')[0];

    // Load clients into select
    authFetch('/users')
        .then(r => r.json())
        .then(users => {
            const clients = users.filter(u => u.role === 'client');
            const sel = document.getElementById('f-client');
            sel.innerHTML = '<option value="">— Select a client —</option>' +
                clients.map(c => `<option value="${c.id}">${c.name} (${c.email})</option>`).join('');
        })
        .catch(() => {
            document.getElementById('f-client').innerHTML = '<option value="">Failed to load clients</option>';
        });

    async function createProject() {
        const title    = document.getElementById('f-title').value.trim();
        const desc     = document.getElementById('f-desc').value.trim();
        const status   = document.getElementById('f-status').value;
        const deadline = document.getElementById('f-deadline').value;
        const clientId = document.getElementById('f-client').value;
        const btn      = document.getElementById('create-btn');
        const btnText  = document.getElementById('create-btn-text');

        clearAll();

        if (!title)    { showErr('Project title is required.'); return; }
        if (!deadline) { showErr('Please select a deadline.'); return; }
        if (!clientId) { showErr('Please select a client to assign this project to.'); return; }

        btn.disabled = true;
        btnText.textContent = 'Creating…';

        try {
            const res = await authFetch('/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title,
                    description: desc,
                    status,
                    deadline,
                    client: { id: parseInt(clientId) }
                })
            });
            const data = await res.json();

            if (!res.ok) {
                showErr(data.error || 'Failed to create project.');
                return;
            }

            showOk(`✓ Project "${data.title}" created successfully! Redirecting…`);
            setTimeout(() => window.location.href = 'AllProjects.html', 1800);

        } catch (e) {
            showErr('Cannot reach server.');
        } finally {
            btn.disabled = false;
            btnText.textContent = 'Create Project →';
        }
    }

    function showErr(msg) { const el = document.getElementById('err-banner'); el.textContent = msg; el.classList.add('show'); }
    function showOk(msg)  { const el = document.getElementById('ok-banner');  el.textContent = msg; el.classList.add('show'); }
    function clearAll()   { document.getElementById('err-banner').classList.remove('show'); document.getElementById('ok-banner').classList.remove('show'); }
</script>
</body>
</html>

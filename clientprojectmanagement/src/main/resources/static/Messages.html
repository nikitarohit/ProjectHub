<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var r=localStorage.getItem('user');if(!r){window.location.replace('login.html');return;}var u=JSON.parse(r);if(u.role==='admin')window.location.replace('Admin.html');if(u.role==='developer')window.location.replace('MyTasks.html');})();</script>
    <script src="auth.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — ProjectHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.12);--bg:#0d0f1a;--bg-card:rgba(255,255,255,0.04);--bg-hover:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.08);--border-hover:rgba(0,212,255,0.3);--text-primary:#eef0ff;--text-secondary:rgba(200,210,240,0.55);--text-muted:rgba(200,210,240,0.3);--green:#22c97a;--amber:#f5a623;--red:#ff5e5e;--purple:#a78bfa;--sidebar-w:240px}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text-primary);display:flex}
        body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 60% at 5% 40%,rgba(0,100,180,0.14) 0%,transparent 65%);pointer-events:none}
        body::after{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:rgba(10,13,28,0.9);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 20px;z-index:10;backdrop-filter:blur(12px)}
        .sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:40px}
        .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--cyan),#4facfe);border-radius:8px;display:flex;align-items:center;justify-content:center}
        .brand-icon svg{width:18px;height:18px}
        .brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text-primary)}
        .nav-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin-bottom:8px}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);transition:all 0.2s;margin-bottom:2px;text-decoration:none}
        .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.7}
        .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text-primary)}
        .nav-item.active{background:var(--cyan-dim);color:var(--cyan);font-weight:500}
        .nav-item.active svg{opacity:1}
        .nav-item.danger{color:var(--red)}
        .nav-item.danger:hover{background:rgba(255,94,94,0.1)}
        .sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:20px}
        .user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:8px}
        .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#00bfdf,#4facfe);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:#001830;flex-shrink:0}
        .user-name-text{font-size:13px;font-weight:500;color:var(--text-primary)}
        .user-role-text{font-size:11px;color:var(--text-muted)}
        .main{margin-left:var(--sidebar-w);flex:1;position:relative;z-index:1;padding:40px 44px;display:flex;flex-direction:column;min-height:100vh}
        .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;animation:rise 0.6s cubic-bezier(0.22,1,0.36,1) both}
        .page-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
        .page-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.6px;color:var(--text-primary)}
        .msg-layout{display:grid;grid-template-columns:270px 1fr;gap:16px;flex:1;animation:rise 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both;min-height:540px}
        .thread-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
        .thread-header{padding:14px 18px;border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text-primary)}
        .thread-item{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.03);cursor:pointer;transition:background 0.2s}
        .thread-item:last-child{border-bottom:none}
        .thread-item:hover{background:var(--bg-hover)}
        .thread-item.active{background:var(--cyan-dim);border-left:2px solid var(--cyan)}
        .thread-av{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--text-secondary);flex-shrink:0}
        .thread-av.c{background:var(--cyan-dim);color:var(--cyan)}
        .thread-info{flex:1;min-width:0}
        .thread-name{font-size:13px;font-weight:500;color:var(--text-primary)}
        .thread-preview{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
        .chat-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
        .chat-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.02)}
        .chat-header-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:white;flex-shrink:0}
        .chat-header-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text-primary)}
        .chat-header-sub{font-size:11px;color:var(--text-muted)}
        .online-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:auto;box-shadow:0 0 6px var(--green)}
        .messages-area{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth;min-height:280px;max-height:420px;background:rgba(0,0,0,0.15)}
        .messages-area::-webkit-scrollbar{width:4px}
        .messages-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:99px}
        .date-sep{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
        .date-sep span{font-size:10px;color:var(--text-muted);background:rgba(255,255,255,0.05);padding:3px 10px;border-radius:20px;white-space:nowrap}
        .date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06)}
        .msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:2px;animation:pop 0.2s ease both}
        .msg-row.me{flex-direction:row-reverse}
        .msg-row.consec .msg-av{visibility:hidden}
        .msg-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;font-family:'Syne',sans-serif}
        .msg-av.me-av{background:linear-gradient(135deg,#00bfdf,#4facfe);color:#001830}
        .msg-av.them-av{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:white}
        .msg-wrap{max-width:65%;display:flex;flex-direction:column;gap:2px}
        .msg-row.me .msg-wrap{align-items:flex-end}
        .msg-sender{font-size:10px;font-weight:500;padding:0 4px;display:none}
        .msg-row:not(.consec) .msg-sender{display:block}
        .msg-row.me .msg-sender{color:var(--cyan)}
        .msg-row:not(.me) .msg-sender{color:var(--purple)}
        .msg-bubble{padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.5;word-break:break-word}
        .msg-row.me .msg-bubble{background:linear-gradient(135deg,rgba(0,180,220,0.25),rgba(79,172,254,0.2));border:1px solid rgba(0,212,255,0.25);color:var(--text-primary);border-bottom-right-radius:4px}
        .msg-row:not(.me) .msg-bubble{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--text-secondary);border-bottom-left-radius:4px}
        .msg-meta{display:flex;align-items:center;gap:4px;padding:0 4px}
        .msg-time{font-size:10px;color:var(--text-muted)}
        .msg-tick{font-size:11px;color:var(--cyan);opacity:0.7}
        .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);gap:10px;padding:40px;text-align:center}
        .placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-muted);padding:40px;text-align:center}
        .chat-input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;background:rgba(255,255,255,0.02)}
        .chat-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:22px;padding:10px 16px;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:13.5px;outline:none;resize:none;transition:all 0.2s;max-height:100px}
        .chat-input::placeholder{color:var(--text-muted)}
        .chat-input:focus{border-color:rgba(0,212,255,0.4);background:rgba(0,212,255,0.04)}
        .send-btn{width:40px;height:40px;background:linear-gradient(135deg,#00bfdf,#4facfe);border:none;border-radius:50%;color:#001830;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
        .send-btn:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(0,212,255,0.4)}
        .send-btn svg{width:17px;height:17px}
        .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
        @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        @keyframes pop{from{opacity:0;transform:scale(0.88) translateY(6px)}to{opacity:1;transform:none}}
        @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:24px 20px}.msg-layout{grid-template-columns:1fr}.thread-panel{max-height:200px}}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <p class="nav-label">Menu</p>
    <a class="nav-item" href="index.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</a>
    <a class="nav-item" href="MyProjects.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>My Projects</a>
    <a class="nav-item" href="deadlines.html"><svg viewBox="0 0 16 16" fill="none"><path d="M8 1v6l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/></svg>Deadlines</a>
    <a class="nav-item active" href="Messages.html"><svg viewBox="0 0 16 16" fill="none"><path d="M14 10.667c0 .344-.077.683-.226.995a2.59 2.59 0 01-.627.845c-.38.344-.793.516-1.214.516-.306 0-.638-.09-.99-.272L8 10.667l-2.943 2.084c-.352.181-.684.272-.99.272-.421 0-.835-.172-1.214-.516a2.59 2.59 0 01-.627-.845A2.432 2.432 0 012 10.667V4a2 2 0 012-2h8a2 2 0 012 2v6.667z" stroke="currentColor" stroke-width="1.4"/></svg>Messages</a>
    <a class="nav-item" href="ClientChat.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 2h12v10H9l-3 3v-3H2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Chat with Admin</a>
    <a class="nav-item" href="Profile.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Profile</a>
    <div class="sidebar-bottom">
        <div class="user-pill"><div class="avatar" id="sb-avatar">?</div><div><div class="user-name-text" id="sb-name">…</div><div class="user-role-text">client</div></div></div>
        <a class="nav-item danger" href="#" onclick="doLogout()"><svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div><p class="page-eyebrow">Communication</p><h1 class="page-title">Messages</h1></div>
    </div>
    <div class="msg-layout">
        <div class="thread-panel">
            <div class="thread-header">My Project Chats</div>
            <div id="thread-list"></div>
        </div>
        <div class="chat-panel">
            <div class="placeholder" id="placeholder">
                <svg viewBox="0 0 40 40" fill="none" style="width:40px;height:40px;opacity:0.2;"><path d="M33 26c0 .7-.15 1.4-.45 2a5 5 0 01-1.25 1.7c-.76.69-1.59 1.03-2.43 1.03-.61 0-1.28-.18-1.98-.54L20 27l-6.89 3.2c-.7.35-1.37.54-1.98.54-.84 0-1.67-.34-2.43-1.03A5 5 0 017.45 28C7.15 27.4 7 26.7 7 26V10a4 4 0 014-4h18a4 4 0 014 4v16z" stroke="currentColor" stroke-width="1.5"/></svg>
                <p style="font-size:13px;">Select a project to open its chat</p>
            </div>
            <div id="chat-content" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
                <div class="chat-header">
                    <div class="chat-header-av" id="chat-av">?</div>
                    <div><div class="chat-header-name" id="chat-name">—</div><div class="chat-header-sub">Project chat with Admin</div></div>
                    <div class="online-dot"></div>
                </div>
                <div class="messages-area" id="msg-area"></div>
                <div class="chat-input-area">
                    <textarea class="chat-input" id="msg-input" placeholder="Type a message…" rows="1" onkeydown="handleKey(event)"></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMsg()"><svg viewBox="0 0 18 18" fill="none"><path d="M15.5 2.5L8 10M15.5 2.5L10.5 15.5L8 10L2.5 7.5L15.5 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                </div>
            </div>
        </div>
    </div>
</main>
<script>
    var user = JSON.parse(localStorage.getItem('user'));
    var activeProjectId = null, pollTimer = null;

    function doLogout(){ localStorage.removeItem('user'); localStorage.removeItem('token'); window.location.replace('login.html'); }
    function initials(n){ if(!n)return'?'; return n.trim().split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
    function fmtTime(ts){ if(!ts)return''; return new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
    function escHtml(t){ var d=document.createElement('div'); d.appendChild(document.createTextNode(t||'')); return d.innerHTML; }
    function getDateLabel(ts){ if(!ts)return''; var d=new Date(ts),now=new Date(),yes=new Date(now); yes.setDate(yes.getDate()-1); if(d.toDateString()===now.toDateString())return'Today'; if(d.toDateString()===yes.toDateString())return'Yesterday'; return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); }

    document.getElementById('sb-name').textContent   = user.name||'Client';
    document.getElementById('sb-avatar').textContent = initials(user.name);

    // Load projects as threads
    authFetch('/clients/'+user.id+'/projects')
        .then(function(r){return r.json();})
        .then(function(projects){
            var el = document.getElementById('thread-list');
            if(!projects.length){ el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No projects yet</div>'; return; }
            el.innerHTML = projects.map(function(p,i){
                return '<div class="thread-item'+(i===0?' active':'')+'" id="th-'+p.id+'" onclick="selectThread('+p.id+',\''+escHtml(p.title)+'\')">'
                    +'<div class="thread-av'+(i===0?' c':'')+'" id="tav-'+p.id+'">'+initials(p.title)+'</div>'
                    +'<div class="thread-info"><div class="thread-name">'+p.title+'</div>'
                    +'<div class="thread-preview">'+(p.lastMessage||'No messages yet')+'</div></div></div>';
            }).join('');
            if(projects.length>0) selectThread(projects[0].id, projects[0].title);
        })
        .catch(function(){ document.getElementById('thread-list').innerHTML='<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">Failed to load</div>'; });

    function selectThread(id, title){
        document.querySelectorAll('.thread-item').forEach(function(t){t.classList.remove('active');});
        document.querySelectorAll('.thread-av').forEach(function(a){a.classList.remove('c');});
        var th = document.getElementById('th-'+id);
        var tav = document.getElementById('tav-'+id);
        if(th) th.classList.add('active');
        if(tav) tav.classList.add('c');
        activeProjectId = id;
        document.getElementById('chat-av').textContent   = initials(title);
        document.getElementById('chat-name').textContent = title;
        document.getElementById('placeholder').style.display = 'none';
        var cc = document.getElementById('chat-content');
        cc.style.display='flex'; cc.style.flexDirection='column';
        loadMsgs(true);
        clearInterval(pollTimer);
        pollTimer = setInterval(function(){ loadMsgs(false); }, 5000);
    }

    function loadMsgs(scroll){
        if(!activeProjectId) return;
        authFetch('/messages/project/'+activeProjectId)
            .then(function(r){return r.json();})
            .then(function(data){ renderMsgs(data,scroll); })
            .catch(function(){});
    }

    function renderMsgs(data, scroll){
        var area = document.getElementById('msg-area');
        if(!scroll && area.querySelectorAll('.msg-row').length===data.length) return;
        if(!data.length){ area.innerHTML='<div class="chat-empty"><p>No messages yet. Say hello! 👋</p></div>'; return; }
        area.innerHTML='';
        var lastSender=null, lastDate=null;
        data.forEach(function(m){
            var isMe = m.senderName===user.name;
            var dl = getDateLabel(m.timestamp);
            if(dl!==lastDate){ var sep=document.createElement('div'); sep.className='date-sep'; sep.innerHTML='<span>'+dl+'</span>'; area.appendChild(sep); lastDate=dl; lastSender=null; }
            var isConsec = lastSender===(isMe?'me':'them'); lastSender=isMe?'me':'them';
            var row=document.createElement('div');
            row.className='msg-row '+(isMe?'me ':'')+(isConsec?'consec':'');
            row.innerHTML='<div class="msg-av '+(isMe?'me-av':'them-av')+'">'+initials(m.senderName)+'</div>'
                +'<div class="msg-wrap"><span class="msg-sender">'+m.senderName+'</span>'
                +'<div class="msg-bubble">'+escHtml(m.content)+'</div>'
                +'<div class="msg-meta"><span class="msg-time">'+fmtTime(m.timestamp)+'</span>'+(isMe?'<span class="msg-tick">✓✓</span>':'')+'</div></div>';
            area.appendChild(row);
        });
        area.scrollTop=area.scrollHeight;
    }

    function sendMsg(){
        var input=document.getElementById('msg-input'), msg=input.value.trim();
        if(!msg||!activeProjectId) return;
        var btn=document.getElementById('send-btn'); btn.disabled=true;
        authFetch('/messages',{ method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({content:msg,project:{id:activeProjectId},sender:{id:user.id}})
        }).then(function(){ input.value=''; input.style.height='auto'; loadMsgs(true); })
            .catch(function(){ alert('Failed to send.'); })
            .finally(function(){ btn.disabled=false; input.focus(); });
    }

    function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} }
    document.getElementById('msg-input').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,100)+'px'; });
    window.addEventListener('beforeunload',function(){clearInterval(pollTimer);});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth.js"></script>
    <script>(function(){
        var r=localStorage.getItem('user');
        if(!r){window.location.replace('login.html');return;}
        var u=JSON.parse(r);
        if((u.role||'').toUpperCase()!=='DEVELOPER') window.location.replace('login.html');
    })();</script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks — ProjectHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.12);--bg:#0d0f1a;--bg-card:rgba(255,255,255,0.04);--bg-hover:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.08);--border-hover:rgba(0,212,255,0.3);--text-primary:#eef0ff;--text-secondary:rgba(200,210,240,0.55);--text-muted:rgba(200,210,240,0.3);--green:#22c97a;--amber:#f5a623;--red:#ff5e5e;--purple:#a78bfa;--sidebar-w:240px}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text-primary);display:flex}
        body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 60% at 5% 40%,rgba(0,80,180,0.12) 0%,transparent 65%);pointer-events:none}
        body::after{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:rgba(10,13,28,0.9);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 20px;z-index:10;backdrop-filter:blur(12px)}
        .sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--cyan),#4facfe);border-radius:8px;display:flex;align-items:center;justify-content:center}
        .brand-icon svg{width:18px;height:18px}
        .brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text-primary)}
        .dev-chip{font-size:9px;background:rgba(0,212,255,0.12);color:var(--cyan);border:1px solid rgba(0,212,255,0.25);padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:0.08em;display:inline-block;margin-left:44px;margin-bottom:28px}
        .nav-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin-bottom:8px}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);transition:all 0.2s;margin-bottom:2px;text-decoration:none}
        .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.7}
        .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text-primary)}
        .nav-item.active{background:var(--cyan-dim);color:var(--cyan);font-weight:500}
        .nav-item.active svg{opacity:1}
        .nav-item.danger{color:var(--red)}
        .nav-item.danger:hover{background:rgba(255,94,94,0.1)}
        .sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:18px}
        .user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:8px}
        .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:white;flex-shrink:0}
        .user-name-text{font-size:13px;font-weight:500;color:var(--text-primary)}
        .user-role-text{font-size:11px;color:var(--cyan)}
        .main{margin-left:var(--sidebar-w);flex:1;position:relative;z-index:1;padding:40px 44px;overflow-x:auto}
        .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;animation:rise 0.6s cubic-bezier(0.22,1,0.36,1) both}
        .page-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
        .page-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.6px;color:var(--text-primary)}
        .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;animation:rise 0.6s 0.05s cubic-bezier(0.22,1,0.36,1) both}
        .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px}
        .stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
        .stat-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:var(--text-primary)}
        .stat-lbl{font-size:12px;color:var(--text-muted);margin-top:2px}
        .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;animation:rise 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both}
        .column{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;min-height:400px}
        .col-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .col-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
        .col-dot{width:8px;height:8px;border-radius:50%}
        .col-dot.todo{background:var(--text-muted)}
        .col-dot.inprogress{background:var(--amber)}
        .col-dot.done{background:var(--green)}
        .col-count{font-size:11px;background:rgba(255,255,255,0.07);border:1px solid var(--border);padding:2px 8px;border-radius:10px;color:var(--text-muted)}
        .cards{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px}
        .task-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px;transition:all 0.2s}
        .task-card:hover{border-color:var(--border-hover);background:var(--bg-hover)}
        .task-title{font-size:13.5px;font-weight:500;color:var(--text-primary);margin-bottom:4px}
        .task-project{font-size:11px;color:var(--cyan);margin-bottom:8px}
        .task-desc{font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .task-footer{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
        .priority-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;text-transform:uppercase}
        .priority-badge.HIGH{background:rgba(255,94,94,0.15);color:var(--red);border:1px solid rgba(255,94,94,0.25)}
        .priority-badge.MEDIUM{background:rgba(245,166,35,0.12);color:var(--amber);border:1px solid rgba(245,166,35,0.25)}
        .priority-badge.LOW{background:rgba(34,201,122,0.1);color:var(--green);border:1px solid rgba(34,201,122,0.2)}
        .move-btns{display:flex;gap:6px}
        .move-btn{flex:1;padding:5px 8px;font-size:11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif}
        .move-btn:hover{background:var(--cyan-dim);color:var(--cyan);border-color:rgba(0,212,255,0.3)}
        .move-btn:disabled{opacity:0.3;cursor:not-allowed}
        .view-btn{width:100%;margin-top:6px;padding:6px;font-size:11px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif}
        .view-btn:hover{background:rgba(167,139,250,0.1);color:var(--purple);border-color:rgba(167,139,250,0.3)}
        .empty-col{padding:24px;text-align:center;color:var(--text-muted);font-size:12px;opacity:0.6}
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
        .overlay.open{display:flex}
        .modal{background:#13162a;border:1px solid var(--border);border-radius:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:pop 0.25s cubic-bezier(0.22,1,0.36,1)}
        .modal-header{padding:20px 22px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
        .modal-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--text-primary)}
        .modal-close{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
        .modal-close:hover{background:rgba(255,94,94,0.1);color:var(--red)}
        .task-detail-box{margin:0 22px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px}
        .task-detail-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
        .task-detail-desc{font-size:12px;color:var(--text-muted);line-height:1.5}
        .comments-wrap{padding:0 22px 22px}
        .comments-title{font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:10px}
        .comment-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:220px;overflow-y:auto}
        .comment-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:10px 12px}
        .comment-meta{display:flex;align-items:center;gap:6px;margin-bottom:4px}
        .comment-author{font-size:11px;font-weight:600;color:var(--cyan)}
        .comment-role{font-size:10px;color:var(--text-muted)}
        .comment-time{font-size:10px;color:var(--text-muted);margin-left:auto}
        .comment-text{font-size:13px;color:var(--text-secondary);line-height:1.5}
        .comment-input-row{display:flex;gap:8px}
        .comment-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 14px;border-radius:10px;outline:none}
        .comment-input:focus{border-color:rgba(0,212,255,0.4)}
        .comment-send{padding:9px 16px;background:var(--cyan-dim);border:1px solid rgba(0,212,255,0.3);color:var(--cyan);border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s;font-family:inherit}
        .comment-send:hover{background:rgba(0,212,255,0.2)}
        @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        @keyframes pop{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:none}}
        @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:20px}.kanban{grid-template-columns:1fr}.stats-row{grid-template-columns:repeat(3,1fr)}}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <span class="dev-chip">DEVELOPER</span>
    <p class="nav-label">Menu</p>
    <a class="nav-item active" href="MyTasks.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="6" y="1" width="4" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="1" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>My Tasks</a>
    <a class="nav-item" href="Profile.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Profile</a>
    <div class="sidebar-bottom">
        <div class="user-pill"><div class="avatar" id="sb-avatar">?</div><div><div class="user-name-text" id="sb-name">Developer</div><div class="user-role-text">developer</div></div></div>
        <a class="nav-item danger" href="#" onclick="doLogout()"><svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <div><p class="page-eyebrow">Developer</p><h1 class="page-title">My Tasks</h1></div>
    </div>
    <div class="stats-row">
        <div class="stat-card"><div class="stat-icon">📋</div><div><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Total Tasks</div></div></div>
        <div class="stat-card"><div class="stat-icon">⚡</div><div><div class="stat-val" id="s-inprogress">—</div><div class="stat-lbl">In Progress</div></div></div>
        <div class="stat-card"><div class="stat-icon">✅</div><div><div class="stat-val" id="s-done">—</div><div class="stat-lbl">Completed</div></div></div>
    </div>
    <div class="kanban">
        <div class="column">
            <div class="col-header"><span class="col-title"><span class="col-dot todo"></span>To Do</span><span class="col-count" id="cnt-TODO">0</span></div>
            <div class="cards" id="col-TODO"></div>
        </div>
        <div class="column">
            <div class="col-header"><span class="col-title"><span class="col-dot inprogress"></span>In Progress</span><span class="col-count" id="cnt-IN_PROGRESS">0</span></div>
            <div class="cards" id="col-IN_PROGRESS"></div>
        </div>
        <div class="column">
            <div class="col-header"><span class="col-title"><span class="col-dot done"></span>Done</span><span class="col-count" id="cnt-DONE">0</span></div>
            <div class="cards" id="col-DONE"></div>
        </div>
    </div>
</main>

<!-- Comments Modal -->
<div class="overlay" id="comment-modal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modal-task-title">Task Details</span>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="task-detail-box">
            <div class="task-detail-title" id="modal-task-name"></div>
            <div class="task-detail-desc"  id="modal-task-desc"></div>
        </div>
        <div class="comments-wrap">
            <div class="comments-title">💬 Comments</div>
            <div class="comment-list" id="comment-list"></div>
            <div class="comment-input-row">
                <input class="comment-input" id="comment-input" placeholder="Add a comment…">
                <button class="comment-send" onclick="sendComment()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    var user       = JSON.parse(localStorage.getItem('user'));
    var allTasks   = [];
    var openTaskId = null;

    // Backend task status values: TODO, IN_PROGRESS, IN_REVIEW, DONE
    // We use 3 columns: TODO, IN_PROGRESS, DONE (IN_REVIEW goes into IN_PROGRESS column)
    var COLS = ['TODO', 'IN_PROGRESS', 'DONE'];

    function doLogout(){ localStorage.removeItem('user'); localStorage.removeItem('token'); window.location.replace('login.html'); }
    function initials(n){ if(!n)return'?'; return n.trim().split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
    function escHtml(t){ var d=document.createElement('div'); d.appendChild(document.createTextNode(t||'')); return d.innerHTML; }
    function fmtDate(ts){ if(!ts)return''; var d=new Date(ts); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }

    document.getElementById('sb-name').textContent   = user.name || 'Developer';
    document.getElementById('sb-avatar').textContent = initials(user.name);

    function colOf(status){
        // Map backend status → column
        var s = (status||'').toUpperCase();
        if(s === 'DONE')        return 'DONE';
        if(s === 'IN_PROGRESS' || s === 'IN_REVIEW') return 'IN_PROGRESS';
        return 'TODO';
    }

    function loadTasks(){
        authFetch('/tasks/developer/' + user.id)
            .then(function(r){ return r.json(); })
            .then(function(tasks){
                allTasks = tasks;
                document.getElementById('s-total').textContent      = tasks.length;
                document.getElementById('s-inprogress').textContent = tasks.filter(function(t){ return colOf(t.status)==='IN_PROGRESS'; }).length;
                document.getElementById('s-done').textContent       = tasks.filter(function(t){ return t.status==='DONE'; }).length;
                renderBoard(tasks);
            })
            .catch(function(err){ console.error('Tasks load error:', err); });
    }

    function renderBoard(tasks){
        var cols = { TODO:[], IN_PROGRESS:[], DONE:[] };
        tasks.forEach(function(t){ cols[colOf(t.status)].push(t); });

        COLS.forEach(function(colKey){
            var colEl  = document.getElementById('col-' + colKey);
            var cntEl  = document.getElementById('cnt-' + colKey);
            cntEl.textContent = cols[colKey].length;
            if(!cols[colKey].length){
                colEl.innerHTML = '<div class="empty-col">No tasks here</div>';
                return;
            }
            colEl.innerHTML = '';
            cols[colKey].forEach(function(t){ colEl.appendChild(makeCard(t, colKey)); });
        });
    }

    function makeCard(t, currentCol){
        var div = document.createElement('div');
        div.className = 'task-card';

        var prio      = (t.priority || 'MEDIUM').toUpperCase();
        var canBack   = currentCol !== 'TODO';
        var canFwd    = currentCol !== 'DONE';
        // Backend status values for PATCH
        var prevStatus = currentCol === 'IN_PROGRESS' ? 'TODO'        : 'IN_PROGRESS';
        var nextStatus = currentCol === 'TODO'         ? 'IN_PROGRESS' : 'DONE';
        var prevLabel  = currentCol === 'IN_PROGRESS'  ? '← To Do'     : '← In Progress';
        var nextLabel  = currentCol === 'TODO'          ? 'In Progress →' : 'Done ✓';

        div.innerHTML =
            '<div class="task-title">'  + escHtml(t.title) + '</div>' +
            (t.projectName || t.projectTitle ? '<div class="task-project">📁 ' + escHtml(t.projectName||t.projectTitle) + '</div>' : '') +
            (t.description ? '<div class="task-desc">' + escHtml(t.description) + '</div>' : '') +
            '<div class="task-footer">' +
            '  <span class="priority-badge ' + prio + '">' + prio + '</span>' +
            '</div>' +
            '<div class="move-btns">' +
            '  <button class="move-btn" ' + (canBack?'':'disabled') + ' onclick="moveTask('+t.id+',\''+prevStatus+'\')">' + prevLabel + '</button>' +
            '  <button class="move-btn" ' + (canFwd ?'':'disabled') + ' onclick="moveTask('+t.id+',\''+nextStatus+'\')">' + nextLabel + '</button>' +
            '</div>' +
            '<button class="view-btn" onclick="openComments('+t.id+')">💬 View Comments</button>';

        return div;
    }

    function moveTask(taskId, newStatus){
        authFetch('/tasks/' + taskId + '/status', {
            method: 'PATCH',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ status: newStatus })
        })
            .then(function(r){ if(!r.ok) throw new Error(); loadTasks(); })
            .catch(function(err){ console.error('Move task error:', err); });
    }

    // ── Comments ──────────────────────────────────────────────────────
    function openComments(taskId){
        openTaskId = taskId;
        var t = allTasks.find(function(x){ return x.id === taskId; });
        document.getElementById('modal-task-title').textContent = t ? t.title : 'Task';
        document.getElementById('modal-task-name').textContent  = t ? t.title : '';
        document.getElementById('modal-task-desc').textContent  = t ? (t.description || 'No description.') : '';
        loadComments(taskId);
        document.getElementById('comment-modal').classList.add('open');
    }

    function closeModal(){
        document.getElementById('comment-modal').classList.remove('open');
        openTaskId = null;
    }

    document.getElementById('comment-modal').addEventListener('click', function(e){
        if(e.target === this) closeModal();
    });

    function loadComments(taskId){
        authFetch('/tasks/' + taskId + '/comments')
            .then(function(r){ return r.json(); })
            .then(function(comments){
                var list = document.getElementById('comment-list');
                if(!comments.length){
                    list.innerHTML = '<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:12px;">No comments yet — start the conversation!</div>';
                    return;
                }
                list.innerHTML = comments.map(function(c){
                    return '<div class="comment-item">'
                        + '<div class="comment-meta">'
                        + '<span class="comment-author">' + escHtml(c.senderName||c.authorName||'User') + '</span>'
                        + '<span class="comment-role">(' + (c.senderRole||c.role||'') + ')</span>'
                        + '<span class="comment-time">'  + fmtDate(c.createdAt||c.sentAt) + '</span>'
                        + '</div>'
                        + '<div class="comment-text">' + escHtml(c.content) + '</div>'
                        + '</div>';
                }).join('');
                list.scrollTop = list.scrollHeight;
            })
            .catch(function(err){ console.error('Comments load error:', err); });
    }

    function sendComment(){
        if(!openTaskId) return;
        var input   = document.getElementById('comment-input');
        var content = input.value.trim();
        if(!content) return;
        authFetch('/tasks/' + openTaskId + '/comments', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ content: content, senderId: user.id })
        })
            .then(function(r){ if(!r.ok) throw new Error(); input.value = ''; loadComments(openTaskId); })
            .catch(function(err){ console.error('Comment send error:', err); });
    }

    document.getElementById('comment-input').addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); sendComment(); }
    });

    loadTasks();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth.js"></script>
    <script>(function(){
        var r=localStorage.getItem('user');
        if(!r){window.location.replace('login.html');return;}
        var u=JSON.parse(r);
        if((u.role||'').toUpperCase()!=='ADMIN') window.location.replace('login.html');
    })();</script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects — ProjectHub Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.12);--bg:#0d0f1a;--bg-card:rgba(255,255,255,0.04);--bg-hover:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.08);--border-hover:rgba(0,212,255,0.3);--text-primary:#eef0ff;--text-secondary:rgba(200,210,240,0.55);--text-muted:rgba(200,210,240,0.3);--green:#22c97a;--amber:#f5a623;--red:#ff5e5e;--purple:#a78bfa;--sidebar-w:240px}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text-primary);display:flex}
        body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 60% at 5% 40%,rgba(80,0,180,0.1) 0%,transparent 65%);pointer-events:none}
        body::after{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:rgba(10,13,28,0.92);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 20px;z-index:10;backdrop-filter:blur(12px)}
        .sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--cyan),#4facfe);border-radius:8px;display:flex;align-items:center;justify-content:center}
        .brand-icon svg{width:18px;height:18px}
        .brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text-primary)}
        .admin-chip{font-size:9px;background:rgba(167,139,250,0.15);color:var(--purple);border:1px solid rgba(167,139,250,0.25);padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:0.08em;display:inline-block;margin-left:44px;margin-bottom:28px}
        .nav-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin-bottom:8px}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);transition:all 0.2s;margin-bottom:2px;text-decoration:none}
        .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.7}
        .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text-primary)}
        .nav-item.active{background:var(--cyan-dim);color:var(--cyan);font-weight:500}
        .nav-item.active svg{opacity:1}
        .nav-item.danger{color:var(--red)}
        .nav-item.danger:hover{background:rgba(255,94,94,0.1)}
        .sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:18px}
        .user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:8px}
        .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:white;flex-shrink:0}
        .user-name-text{font-size:13px;font-weight:500;color:var(--text-primary)}
        .user-role-text{font-size:11px;color:var(--purple)}
        .main{margin-left:var(--sidebar-w);flex:1;position:relative;z-index:1;padding:40px 44px}
        .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;animation:rise 0.6s cubic-bezier(0.22,1,0.36,1) both}
        .page-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
        .page-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.6px;color:var(--text-primary)}
        .badge{background:var(--cyan-dim);border:1px solid rgba(0,212,255,0.2);color:var(--cyan);font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px}
        .filter-bar{display:flex;gap:8px;margin-bottom:20px;animation:rise 0.6s 0.08s cubic-bezier(0.22,1,0.36,1) both;flex-wrap:wrap}
        .filter-btn{padding:7px 16px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);transition:all 0.2s;font-family:inherit}
        .filter-btn:hover{border-color:var(--border-hover);color:var(--text-primary)}
        .filter-btn.active{background:var(--cyan-dim);border-color:rgba(0,212,255,0.3);color:var(--cyan)}
        .table-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:rise 0.6s 0.12s cubic-bezier(0.22,1,0.36,1) both}
        .table-head{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr 0.8fr;padding:12px 20px;border-bottom:1px solid var(--border)}
        .th{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted)}
        .table-row{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr 0.8fr;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.03);align-items:center;cursor:pointer;transition:background 0.2s;text-decoration:none}
        .table-row:last-child{border-bottom:none}
        .table-row:hover{background:var(--bg-hover)}
        .row-title{font-size:13.5px;font-weight:500;color:var(--text-primary)}
        .row-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
        .row-cell{font-size:13px;color:var(--text-secondary)}
        .status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px}
        .status-badge .dot{width:5px;height:5px;border-radius:50%}
        .status-badge.in_progress{background:rgba(0,212,255,0.12);color:var(--cyan);border:1px solid rgba(0,212,255,0.25)}
        .status-badge.in_progress .dot{background:var(--cyan)}
        .status-badge.pending{background:rgba(245,166,35,0.12);color:var(--amber);border:1px solid rgba(245,166,35,0.25)}
        .status-badge.pending .dot{background:var(--amber)}
        .status-badge.completed{background:rgba(34,201,122,0.12);color:var(--green);border:1px solid rgba(34,201,122,0.25)}
        .status-badge.completed .dot{background:var(--green)}
        .status-badge.review{background:rgba(167,139,250,0.12);color:var(--purple);border:1px solid rgba(167,139,250,0.25)}
        .status-badge.review .dot{background:var(--purple)}
        .status-badge.cancelled{background:rgba(255,94,94,0.12);color:var(--red);border:1px solid rgba(255,94,94,0.25)}
        .status-badge.cancelled .dot{background:var(--red)}
        .prog-mini{height:4px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden;margin-top:4px}
        .prog-mini-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),#4facfe)}
        .edit-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:rgba(167,139,250,0.12);color:var(--purple);border:1px solid rgba(167,139,250,0.25);padding:4px 10px;border-radius:20px;transition:all 0.2s}
        .table-row:hover .edit-btn{background:rgba(167,139,250,0.2);border-color:rgba(167,139,250,0.4)}
        .empty{padding:60px 20px;text-align:center;color:var(--text-muted);font-size:13px}
        @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:24px 20px}.table-head{display:none}.table-row{grid-template-columns:1fr auto}.table-row>*:nth-child(n+3){display:none}}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <span class="admin-chip">ADMIN PANEL</span>
    <p class="nav-label">Admin</p>
    <a class="nav-item" href="Admin.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</a>
    <a class="nav-item active" href="AllProjects.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>All Projects</a>
    <a class="nav-item" href="TaskBoard.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="6" y="1" width="4" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="1" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>Task Board</a>
    <a class="nav-item" href="Clients.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Clients</a>
    <a class="nav-item" href="AdminMessages.html"><svg viewBox="0 0 16 16" fill="none"><path d="M14 10.667c0 .344-.077.683-.226.995a2.59 2.59 0 01-.627.845c-.38.344-.793.516-1.214.516-.306 0-.638-.09-.99-.272L8 10.667l-2.943 2.084c-.352.181-.684.272-.99.272-.421 0-.835-.172-1.214-.516a2.59 2.59 0 01-.627-.845A2.432 2.432 0 012 10.667V4a2 2 0 012-2h8a2 2 0 012 2v6.667z" stroke="currentColor" stroke-width="1.4"/></svg>Messages</a>
    <a class="nav-item" href="CreateProject.html"><svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Create Project</a>
    <div class="sidebar-bottom">
        <div class="user-pill"><div class="avatar" id="sb-avatar">AD</div><div><div class="user-name-text" id="sb-name">Admin</div><div class="user-role-text">Administrator</div></div></div>
        <a class="nav-item danger" href="#" onclick="doLogout()"><svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <div><p class="page-eyebrow">Admin</p><h1 class="page-title">All Projects</h1></div>
        <span class="badge" id="proj-count">Loading…</span>
    </div>
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filter('all',this)">All</button>
        <button class="filter-btn" onclick="filter('active',this)">In Progress</button>
        <button class="filter-btn" onclick="filter('pending',this)">Pending</button>
        <button class="filter-btn" onclick="filter('review',this)">In Review</button>
        <button class="filter-btn" onclick="filter('completed',this)">Completed</button>
        <button class="filter-btn" onclick="filter('cancelled',this)">Cancelled</button>
    </div>
    <div class="table-card">
        <div class="table-head">
            <div class="th">Project / Client</div>
            <div class="th">Status</div>
            <div class="th">Deadline</div>
            <div class="th">Progress</div>
            <div class="th">Action</div>
        </div>
        <div id="table-body"><div class="empty">Loading…</div></div>
    </div>
</main>

<script>
    var user = JSON.parse(localStorage.getItem('user'));
    var allProjects = [];

    function initials(n){ if(!n)return'?'; return n.trim().split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
    function fmtDate(d){ if(!d)return'—'; try{ return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch(e){return d;} }
    function daysUntil(d){ if(!d)return null; return Math.ceil((new Date(d)-new Date())/86400000); }
    function doLogout(){ localStorage.removeItem('user'); localStorage.removeItem('token'); window.location.replace('login.html'); }
    function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function statusInfo(s){
        switch((s||'').toLowerCase()){
            case 'active':
            case 'in_progress': return {cls:'in_progress', label:'In Progress'};
            case 'completed':
            case 'done':        return {cls:'completed',   label:'Completed'};
            case 'review':
            case 'in_review':   return {cls:'review',      label:'In Review'};
            case 'cancelled':   return {cls:'cancelled',   label:'Cancelled'};
            default:            return {cls:'pending',     label:'Pending'};
        }
    }

    document.getElementById('sb-name').textContent   = user.name || 'Admin';
    document.getElementById('sb-avatar').textContent = initials(user.name);

    authFetch('/projects')
        .then(function(r){ return r.json(); })
        .then(function(projects){
            allProjects = projects;
            render(projects);
        })
        .catch(function(){
            document.getElementById('table-body').innerHTML = '<div class="empty">Failed to load projects. Check console (F12).</div>';
        });

    function render(projects){
        document.getElementById('proj-count').textContent = projects.length + ' project' + (projects.length!==1?'s':'');
        var el = document.getElementById('table-body');
        if(!projects.length){ el.innerHTML='<div class="empty">No projects found</div>'; return; }

        el.innerHTML = projects.map(function(p){
            var si    = statusInfo(p.status);
            var pName = p.title || p.name || 'Untitled';
            var cName = (p.client && p.client.name) ? p.client.name : (p.clientName || '—');
            var dead  = p.deadline || p.endDate;
            var days  = daysUntil(dead);
            var warn  = days !== null && days <= 14 && days >= 0;
            var prog  = p.progress || 0;

            return '<a class="table-row" href="AdminProject.html?id='+p.id+'">'
                + '<div><div class="row-title">'+esc(pName)+'</div><div class="row-sub">'+esc(cName)+'</div></div>'
                + '<div><span class="status-badge '+si.cls+'"><span class="dot"></span>'+si.label+'</span></div>'
                + '<div class="row-cell" style="'+(warn?'color:var(--amber)':'')+'">'+fmtDate(dead)+'</div>'
                + '<div><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px;">'+prog+'%</div>'
                + '<div class="prog-mini"><div class="prog-mini-fill" style="width:'+prog+'%"></div></div></div>'
                + '<div><span class="edit-btn">✏️ Edit</span></div>'
                + '</a>';
        }).join('');
    }

    function filter(type, btn){
        document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        if(type === 'all') render(allProjects);
        else render(allProjects.filter(function(p){ return (p.status||'').toLowerCase() === type.toLowerCase(); }));
    }
</script>
</body>
</html>

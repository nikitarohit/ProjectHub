<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var r=localStorage.getItem('user');if(!r){window.location.replace('login.html');return;}var u=JSON.parse(r);if(u.role==='admin')window.location.replace('Admin.html');if(u.role==='developer')window.location.replace('MyTasks.html');})();</script>
    <script src="auth.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects — ProjectHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.12);--bg:#0d0f1a;--bg-card:rgba(255,255,255,0.04);--bg-hover:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.08);--border-hover:rgba(0,212,255,0.3);--text-primary:#eef0ff;--text-secondary:rgba(200,210,240,0.55);--text-muted:rgba(200,210,240,0.3);--green:#22c97a;--amber:#f5a623;--red:#ff5e5e;--sidebar-w:240px}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text-primary);display:flex}
        body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 60% at 5% 40%,rgba(0,100,180,0.14) 0%,transparent 65%);pointer-events:none}
        body::after{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:rgba(10,13,28,0.9);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 20px;z-index:10;backdrop-filter:blur(12px)}
        .sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:40px}
        .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--cyan),#4facfe);border-radius:8px;display:flex;align-items:center;justify-content:center}
        .brand-icon svg{width:18px;height:18px}
        .brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text-primary)}
        .nav-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin-bottom:8px}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);transition:all 0.2s;margin-bottom:2px;text-decoration:none}
        .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.7}
        .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text-primary)}
        .nav-item.active{background:var(--cyan-dim);color:var(--cyan);font-weight:500}
        .nav-item.active svg{opacity:1}
        .nav-item.danger{color:var(--red)}
        .nav-item.danger:hover{background:rgba(255,94,94,0.1)}
        .sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:20px}
        .user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:8px}
        .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#00bfdf,#4facfe);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:#001830;flex-shrink:0}
        .user-name-text{font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .user-role-text{font-size:11px;color:var(--text-muted)}
        .main{margin-left:var(--sidebar-w);flex:1;position:relative;z-index:1;padding:40px 44px}
        .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;animation:rise 0.6s cubic-bezier(0.22,1,0.36,1) both}
        .page-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
        .page-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.6px;color:var(--text-primary)}
        .badge{background:var(--cyan-dim);border:1px solid rgba(0,212,255,0.2);color:var(--cyan);font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px}
        .filter-bar{display:flex;gap:8px;margin-bottom:20px;animation:rise 0.6s 0.08s cubic-bezier(0.22,1,0.36,1) both;flex-wrap:wrap}
        .filter-btn{padding:7px 16px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);transition:all 0.2s}
        .filter-btn:hover{border-color:var(--border-hover);color:var(--text-primary)}
        .filter-btn.active{background:var(--cyan-dim);border-color:rgba(0,212,255,0.3);color:var(--cyan)}
        .table-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:rise 0.6s 0.12s cubic-bezier(0.22,1,0.36,1) both}
        .table-head{display:grid;grid-template-columns:2fr 1fr 1.2fr 1.2fr 80px;padding:12px 20px;border-bottom:1px solid var(--border)}
        .th{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted)}
        .table-row{display:grid;grid-template-columns:2fr 1fr 1.2fr 1.2fr 80px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.03);align-items:center;cursor:pointer;transition:background 0.2s;text-decoration:none}
        .table-row:last-child{border-bottom:none}
        .table-row:hover{background:var(--bg-hover)}
        .row-title{font-size:13.5px;font-weight:500;color:var(--text-primary)}
        .row-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
        .row-cell{font-size:13px;color:var(--text-secondary)}
        .status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px}
        .status-badge .dot{width:5px;height:5px;border-radius:50%}
        .status-badge.active{background:rgba(34,201,122,0.12);color:var(--green);border:1px solid rgba(34,201,122,0.25)}
        .status-badge.active .dot{background:var(--green)}
        .status-badge.pending{background:rgba(245,166,35,0.12);color:var(--amber);border:1px solid rgba(245,166,35,0.25)}
        .status-badge.pending .dot{background:var(--amber)}
        .status-badge.completed{background:rgba(0,212,255,0.1);color:var(--cyan);border:1px solid rgba(0,212,255,0.2)}
        .status-badge.completed .dot{background:var(--cyan)}
        .arrow-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--bg-hover);border:1px solid var(--border);color:var(--text-muted);transition:all 0.2s}
        .table-row:hover .arrow-btn{border-color:var(--border-hover);color:var(--cyan)}
        .arrow-btn svg{width:13px;height:13px}
        .empty{padding:60px 20px;text-align:center;color:var(--text-muted);font-size:13px}
        .skel{height:52px;background:rgba(255,255,255,0.05);border-radius:4px;animation:pulse 1.5s ease-in-out infinite;margin:0 20px 2px}
        @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.7}}
        @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:24px 20px}.table-head{display:none}.table-row{grid-template-columns:1fr auto}.table-row>*:nth-child(n+3){display:none}}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <p class="nav-label">Menu</p>
    <a class="nav-item" href="index.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</a>
    <a class="nav-item active" href="MyProjects.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>My Projects</a>
    <a class="nav-item" href="deadlines.html"><svg viewBox="0 0 16 16" fill="none"><path d="M8 1v6l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/></svg>Deadlines</a>
    <a class="nav-item" href="Messages.html"><svg viewBox="0 0 16 16" fill="none"><path d="M14 10.667c0 .344-.077.683-.226.995a2.59 2.59 0 01-.627.845c-.38.344-.793.516-1.214.516-.306 0-.638-.09-.99-.272L8 10.667l-2.943 2.084c-.352.181-.684.272-.99.272-.421 0-.835-.172-1.214-.516a2.59 2.59 0 01-.627-.845A2.432 2.432 0 012 10.667V4a2 2 0 012-2h8a2 2 0 012 2v6.667z" stroke="currentColor" stroke-width="1.4"/></svg>Messages</a>
    <a class="nav-item" href="ClientChat.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 2h12v10H9l-3 3v-3H2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Chat with Admin</a>
    <a class="nav-item" href="Profile.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Profile</a>
    <div class="sidebar-bottom">
        <div class="user-pill"><div class="avatar" id="sb-avatar">?</div><div><div class="user-name-text" id="sb-name">…</div><div class="user-role-text">client</div></div></div>
        <a class="nav-item danger" href="#" onclick="doLogout()"><svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div><p class="page-eyebrow">Client</p><h1 class="page-title">My Projects</h1></div>
        <span class="badge" id="proj-count">Loading…</span>
    </div>
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filter('all',this)">All</button>
        <button class="filter-btn" onclick="filter('active',this)">Active</button>
        <button class="filter-btn" onclick="filter('pending',this)">Pending</button>
        <button class="filter-btn" onclick="filter('completed',this)">Completed</button>
    </div>
    <div class="table-card">
        <div class="table-head">
            <div class="th">Project</div><div class="th">Status</div>
            <div class="th">Deadline</div><div class="th">Last Message</div><div class="th"></div>
        </div>
        <div id="table-body">
            <div class="skel" style="margin-top:12px;"></div>
            <div class="skel" style="animation-delay:.1s"></div>
        </div>
    </div>
</main>
<script>
    var user = JSON.parse(localStorage.getItem('user'));
    var all  = [];

    function doLogout(){ localStorage.removeItem('user'); localStorage.removeItem('token'); window.location.replace('login.html'); }
    function initials(n){ if(!n)return'?'; return n.trim().split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
    function statusCls(s){ if(!s)return'pending'; var l=s.toLowerCase(); if(l==='active')return'active'; if(l==='completed'||l==='done')return'completed'; return'pending'; }
    function fmtDate(d){ if(!d)return'—'; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
    function daysUntil(d){ if(!d)return null; return Math.ceil((new Date(d)-new Date())/86400000); }

    // Fill sidebar
    document.getElementById('sb-name').textContent   = user.name || 'Client';
    document.getElementById('sb-avatar').textContent = initials(user.name);

    authFetch('/clients/' + user.id + '/projects')
        .then(function(r){ return r.json(); })
        .then(function(data){ all=data; render(data); })
        .catch(function(){
            document.getElementById('proj-count').textContent = '0 projects';
            document.getElementById('table-body').innerHTML = '<div class="empty">No projects yet. Admin will assign projects to you soon!</div>';
        });

    function render(data){
        document.getElementById('proj-count').textContent = data.length + ' project' + (data.length!==1?'s':'');
        var el = document.getElementById('table-body');
        if(!data.length){ el.innerHTML='<div class="empty">No projects assigned yet.<br>Contact admin to get projects assigned.</div>'; return; }
        el.innerHTML = data.map(function(p){
            var sc   = statusCls(p.status);
            var days = daysUntil(p.deadline);
            var warn = days!==null && days<=14 && days>=0;
            var dl   = days===null?'—':days>0?days+'d left':days===0?'Today!':'Overdue';
            return '<a class="table-row" href="Project.html?id='+p.id+'">'
                +'<div><div class="row-title">'+p.title+'</div>'
                +'<div class="row-sub">Click to open project chat</div></div>'
                +'<div><span class="status-badge '+sc+'"><span class="dot"></span>'+(p.status||'pending')+'</span></div>'
                +'<div class="row-cell'+(warn?' " style="color:var(--amber)"':'">')+fmtDate(p.deadline)+'<br><span style="font-size:11px;">'+dl+'</span></div>'
                +'<div class="row-cell" style="font-size:12px;font-style:italic;">"'+(p.lastMessage||'No messages yet')+'"</div>'
                +'<div><span class="arrow-btn"><svg viewBox="0 0 13 13" fill="none"><path d="M2.5 6.5h8M7 3l3.5 3.5L7 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>'
                +'</a>';
        }).join('');
    }

    function filter(type,btn){
        document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
        btn.classList.add('active');
        render(type==='all'?all:all.filter(function(p){return statusCls(p.status)===type;}));
    }
</script>
</body>
</html>

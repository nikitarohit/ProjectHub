<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth.js"></script>
    <script>(function(){
        var r=localStorage.getItem('user');
        if(!r){window.location.replace('login.html');return;}
        var u=JSON.parse(r);
        if((u.role||'').toUpperCase()!=='ADMIN') window.location.replace('login.html');
    })();</script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board — ProjectHub Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.12);--bg:#0d0f1a;--bg-card:rgba(255,255,255,0.04);--bg-hover:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.08);--border-hover:rgba(0,212,255,0.3);--text-primary:#eef0ff;--text-secondary:rgba(200,210,240,0.55);--text-muted:rgba(200,210,240,0.3);--green:#22c97a;--amber:#f5a623;--red:#ff5e5e;--purple:#a78bfa;--sidebar-w:240px}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text-primary);display:flex}
        body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 60% at 5% 40%,rgba(80,0,180,0.1) 0%,transparent 65%);pointer-events:none}
        body::after{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:rgba(10,13,28,0.92);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 20px;z-index:10;backdrop-filter:blur(12px)}
        .sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--cyan),#4facfe);border-radius:8px;display:flex;align-items:center;justify-content:center}
        .brand-icon svg{width:18px;height:18px}
        .brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text-primary)}
        .admin-chip{font-size:9px;background:rgba(167,139,250,0.15);color:var(--purple);border:1px solid rgba(167,139,250,0.25);padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:0.08em;display:inline-block;margin-left:44px;margin-bottom:28px}
        .nav-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin-bottom:8px}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);transition:all 0.2s;margin-bottom:2px;text-decoration:none}
        .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.7}
        .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text-primary)}
        .nav-item.active{background:var(--cyan-dim);color:var(--cyan);font-weight:500}
        .nav-item.active svg{opacity:1}
        .nav-item.danger{color:var(--red)}
        .nav-item.danger:hover{background:rgba(255,94,94,0.1)}
        .sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:18px}
        .user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:8px}
        .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:white;flex-shrink:0}
        .user-name-text{font-size:13px;font-weight:500;color:var(--text-primary)}
        .user-role-text{font-size:11px;color:var(--purple)}
        .main{margin-left:var(--sidebar-w);flex:1;position:relative;z-index:1;padding:40px 44px;overflow-x:auto}
        .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;animation:rise 0.6s cubic-bezier(0.22,1,0.36,1) both}
        .page-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
        .page-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.6px;color:var(--text-primary)}
        .topbar-actions{display:flex;gap:10px;align-items:center}
        .proj-select{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 14px;border-radius:10px;outline:none;cursor:pointer}
        .proj-select:focus{border-color:var(--border-hover)}
        .proj-select option{background:#0d0f1a}
        .btn-primary{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#00bfdf,#4facfe);color:#001830;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 18px;border-radius:10px;border:none;cursor:pointer;transition:all 0.2s}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,212,255,0.35)}
        .btn-primary svg{width:14px;height:14px}
        .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;min-height:500px;animation:rise 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both}
        .column{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;min-height:500px}
        .col-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .col-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
        .col-dot{width:8px;height:8px;border-radius:50%}
        .col-dot.todo{background:var(--text-muted)}
        .col-dot.inprogress{background:var(--amber)}
        .col-dot.done{background:var(--green)}
        .col-count{font-size:11px;background:rgba(255,255,255,0.07);border:1px solid var(--border);padding:2px 8px;border-radius:10px;color:var(--text-muted)}
        .cards{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:80px}
        .cards.drag-over{background:rgba(0,212,255,0.04);border-radius:10px}
        .task-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:grab;transition:all 0.2s;position:relative;user-select:none}
        .task-card:hover{border-color:var(--border-hover);background:var(--bg-hover);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
        .task-card.dragging{opacity:0.4;transform:scale(0.97)}
        .task-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
        .task-title{font-size:13.5px;font-weight:500;color:var(--text-primary);line-height:1.4;flex:1}
        .task-desc{font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .task-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
        .priority-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:0.04em}
        .priority-badge.HIGH{background:rgba(255,94,94,0.15);color:var(--red);border:1px solid rgba(255,94,94,0.25)}
        .priority-badge.MEDIUM{background:rgba(245,166,35,0.12);color:var(--amber);border:1px solid rgba(245,166,35,0.25)}
        .priority-badge.LOW{background:rgba(34,201,122,0.1);color:var(--green);border:1px solid rgba(34,201,122,0.2)}
        .assignee-chip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted)}
        .assignee-av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#00bfdf,#4facfe);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#001830}
        .card-actions{display:flex;gap:4px;margin-top:10px;border-top:1px solid rgba(255,255,255,0.05);padding-top:10px}
        .card-btn{flex:1;padding:5px;font-size:11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif}
        .card-btn:hover{background:rgba(255,255,255,0.06);color:var(--text-primary)}
        .card-btn.danger:hover{background:rgba(255,94,94,0.1);color:var(--red);border-color:rgba(255,94,94,0.3)}
        .empty-col{padding:24px;text-align:center;color:var(--text-muted);font-size:12px;opacity:0.6}
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
        .overlay.open{display:flex}
        .modal{background:#13162a;border:1px solid var(--border);border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:pop 0.25s cubic-bezier(0.22,1,0.36,1)}
        .modal-header{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between}
        .modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--text-primary)}
        .modal-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.2s}
        .modal-close:hover{background:rgba(255,94,94,0.1);color:var(--red);border-color:rgba(255,94,94,0.3)}
        .modal-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:14px}
        .field-group{display:flex;flex-direction:column;gap:6px}
        .field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted)}
        .field-input,.field-select,.field-textarea{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:13.5px;padding:10px 14px;border-radius:10px;outline:none;transition:border-color 0.2s;width:100%}
        .field-input:focus,.field-select:focus,.field-textarea:focus{border-color:rgba(0,212,255,0.4)}
        .field-select option{background:#13162a}
        .field-textarea{resize:vertical;min-height:80px}
        .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .modal-footer{display:flex;gap:10px;padding:0 24px 24px}
        .btn-cancel{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s}
        .btn-cancel:hover{background:rgba(255,255,255,0.05)}
        .btn-save{flex:2;padding:10px;border-radius:10px;border:none;background:linear-gradient(135deg,#00bfdf,#4facfe);color:#001830;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
        .btn-save:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,212,255,0.3)}
        .comments-section{border-top:1px solid var(--border);padding:16px 24px}
        .comments-title{font-size:12px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:12px}
        .comment-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:200px;overflow-y:auto}
        .comment-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:10px 12px}
        .comment-meta{display:flex;align-items:center;gap:6px;margin-bottom:4px}
        .comment-author{font-size:11px;font-weight:600;color:var(--cyan)}
        .comment-role{font-size:10px;color:var(--text-muted)}
        .comment-time{font-size:10px;color:var(--text-muted);margin-left:auto}
        .comment-text{font-size:13px;color:var(--text-secondary);line-height:1.5}
        .comment-input-row{display:flex;gap:8px}
        .comment-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 14px;border-radius:10px;outline:none}
        .comment-input:focus{border-color:rgba(0,212,255,0.4)}
        .comment-send{padding:9px 16px;background:var(--cyan-dim);border:1px solid rgba(0,212,255,0.3);color:var(--cyan);border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s;white-space:nowrap;font-family:inherit}
        .comment-send:hover{background:rgba(0,212,255,0.2)}
        @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        @keyframes pop{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:none}}
        @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:20px}.kanban{grid-template-columns:1fr}}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <span class="admin-chip">ADMIN PANEL</span>
    <p class="nav-label">Admin</p>
    <a class="nav-item" href="Admin.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</a>
    <a class="nav-item" href="AllProjects.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>All Projects</a>
    <a class="nav-item active" href="TaskBoard.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="6" y="1" width="4" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="1" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>Task Board</a>
    <a class="nav-item" href="Clients.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Clients</a>
    <a class="nav-item" href="AdminMessages.html"><svg viewBox="0 0 16 16" fill="none"><path d="M14 10.667c0 .344-.077.683-.226.995a2.59 2.59 0 01-.627.845c-.38.344-.793.516-1.214.516-.306 0-.638-.09-.99-.272L8 10.667l-2.943 2.084c-.352.181-.684.272-.99.272-.421 0-.835-.172-1.214-.516a2.59 2.59 0 01-.627-.845A2.432 2.432 0 012 10.667V4a2 2 0 012-2h8a2 2 0 012 2v6.667z" stroke="currentColor" stroke-width="1.4"/></svg>Messages</a>
    <a class="nav-item" href="CreateProject.html"><svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Create Project</a>
    <div class="sidebar-bottom">
        <div class="user-pill"><div class="avatar" id="sb-avatar">AD</div><div><div class="user-name-text" id="sb-name">Admin</div><div class="user-role-text">admin</div></div></div>
        <a class="nav-item danger" href="#" onclick="doLogout()"><svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <div><p class="page-eyebrow">Admin</p><h1 class="page-title">Task Board</h1></div>
        <div class="topbar-actions">
            <select class="proj-select" id="proj-select" onchange="loadBoard()">
                <option value="">Select Project…</option>
            </select>
            <button class="btn-primary" onclick="openCreateModal()">
                <svg viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                New Task
            </button>
        </div>
    </div>

    <div class="kanban" id="kanban">
        <div class="column">
            <div class="col-header"><span class="col-title"><span class="col-dot todo"></span>To Do</span><span class="col-count" id="cnt-TODO">0</span></div>
            <div class="cards" id="col-TODO" ondragover="onDragOver(event)" ondrop="onDrop(event,'TODO')" ondragleave="onDragLeave(event)"></div>
        </div>
        <div class="column">
            <div class="col-header"><span class="col-title"><span class="col-dot inprogress"></span>In Progress</span><span class="col-count" id="cnt-IN_PROGRESS">0</span></div>
            <div class="cards" id="col-IN_PROGRESS" ondragover="onDragOver(event)" ondrop="onDrop(event,'IN_PROGRESS')" ondragleave="onDragLeave(event)"></div>
        </div>
        <div class="column">
            <div class="col-header"><span class="col-title"><span class="col-dot done"></span>Done</span><span class="col-count" id="cnt-DONE">0</span></div>
            <div class="cards" id="col-DONE" ondragover="onDragOver(event)" ondrop="onDrop(event,'DONE')" ondragleave="onDragLeave(event)"></div>
        </div>
    </div>
</main>

<!-- Create / Edit Task Modal -->
<div class="overlay" id="task-modal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">New Task</span>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="edit-task-id">
            <div class="field-group">
                <label class="field-label">Task Title *</label>
                <input class="field-input" id="f-title" placeholder="e.g. Design landing page…">
            </div>
            <div class="field-group">
                <label class="field-label">Description</label>
                <textarea class="field-textarea" id="f-desc" placeholder="What needs to be done?"></textarea>
            </div>
            <div class="field-row">
                <div class="field-group">
                    <label class="field-label">Priority</label>
                    <select class="field-select" id="f-priority">
                        <option value="HIGH">🔴 High</option>
                        <option value="MEDIUM" selected>🟡 Medium</option>
                        <option value="LOW">🟢 Low</option>
                    </select>
                </div>
                <div class="field-group">
                    <label class="field-label">Status</label>
                    <select class="field-select" id="f-status">
                        <option value="TODO">To Do</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="DONE">Done</option>
                    </select>
                </div>
            </div>
            <div class="field-group">
                <label class="field-label">Assign To (Developer)</label>
                <select class="field-select" id="f-assignee">
                    <option value="">Unassigned</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveTask()">Save Task</button>
        </div>
        <div class="comments-section" id="comments-section" style="display:none">
            <div class="comments-title">💬 Comments</div>
            <div class="comment-list" id="comment-list"></div>
            <div class="comment-input-row">
                <input class="comment-input" id="comment-input" placeholder="Add a comment…">
                <button class="comment-send" onclick="sendComment()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    var user     = JSON.parse(localStorage.getItem('user'));
    var allTasks = [];
    var allDevs  = [];
    var dragId   = null;

    // Status mapping: backend value → column id
    // Backend returns: todo, inprogress, done (old) OR TODO, IN_PROGRESS, DONE (new)
    function colOf(status) {
        switch((status||'').toUpperCase()) {
            case 'IN_PROGRESS':
            case 'INPROGRESS':
            case 'IN_REVIEW':   return 'IN_PROGRESS';
            case 'DONE':        return 'DONE';
            default:            return 'TODO';
        }
    }

    function doLogout(){ localStorage.removeItem('user'); localStorage.removeItem('token'); window.location.replace('login.html'); }
    function initials(n){ if(!n)return'?'; return n.trim().split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
    function fmtTime(ts){ if(!ts)return''; return new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
    function fmtDate(ts){ if(!ts)return''; var d=new Date(ts); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+fmtTime(ts); }
    function escHtml(t){ var d=document.createElement('div'); d.appendChild(document.createTextNode(t||'')); return d.innerHTML; }

    document.getElementById('sb-name').textContent   = user.name || 'Admin';
    document.getElementById('sb-avatar').textContent = initials(user.name);

    // Load projects
    authFetch('/projects').then(function(r){ return r.json(); }).then(function(projects){
        var sel = document.getElementById('proj-select');
        projects.forEach(function(p){
            var opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.title || p.name;
            sel.appendChild(opt);
        });
        var urlId = new URLSearchParams(window.location.search).get('projectId');
        if(urlId){ sel.value = urlId; loadBoard(); }
    });

    // Load developers for assignee dropdown
    authFetch('/users').then(function(r){ return r.json(); }).then(function(users){
        allDevs = users.filter(function(u){
            var role = (u.role||'').toLowerCase();
            return role === 'developer' || role === 'admin';
        });
        var sel = document.getElementById('f-assignee');
        allDevs.forEach(function(u){
            var opt = document.createElement('option');
            opt.value = u.id;
            opt.textContent = u.name + ' (' + u.role + ')';
            sel.appendChild(opt);
        });
    });

    // ── Load Board ──────────────────────────────────────────────────────────
    function loadBoard(){
        var projId = document.getElementById('proj-select').value;
        if(!projId){ clearBoard(); return; }
        authFetch('/tasks/project/' + projId)
            .then(function(r){ return r.json(); })
            .then(function(tasks){ allTasks = tasks; renderBoard(tasks); })
            .catch(function(){ clearBoard(); });
    }

    function clearBoard(){
        ['TODO','IN_PROGRESS','DONE'].forEach(function(s){
            document.getElementById('col-'+s).innerHTML = '<div class="empty-col">Select a project to see tasks</div>';
            document.getElementById('cnt-'+s).textContent = '0';
        });
    }

    function renderBoard(tasks){
        var cols = { TODO:[], IN_PROGRESS:[], DONE:[] };
        tasks.forEach(function(t){ cols[colOf(t.status)].push(t); });

        Object.keys(cols).forEach(function(colKey){
            var col   = document.getElementById('col-' + colKey);
            var count = document.getElementById('cnt-' + colKey);
            count.textContent = cols[colKey].length;
            if(!cols[colKey].length){
                col.innerHTML = '<div class="empty-col">No tasks here — drag one in!</div>';
                return;
            }
            col.innerHTML = '';
            cols[colKey].forEach(function(t){ col.appendChild(makeCard(t)); });
        });
    }

    function makeCard(t){
        var div = document.createElement('div');
        div.className  = 'task-card';
        div.draggable  = true;
        div.dataset.id = t.id;
        div.addEventListener('dragstart', function(){ dragId = t.id; setTimeout(function(){ div.classList.add('dragging'); }, 0); });
        div.addEventListener('dragend',   function(){ div.classList.remove('dragging'); dragId = null; });

        var prio   = (t.priority || 'MEDIUM').toUpperCase();
        var aName  = t.assignedToName || t.assigneeName || '';
        var assign = aName
            ? '<div class="assignee-chip"><div class="assignee-av">'+initials(aName)+'</div>'+escHtml(aName)+'</div>'
            : '<span style="font-size:11px;color:var(--text-muted)">Unassigned</span>';

        div.innerHTML =
            '<div class="task-card-header"><div class="task-title">'+escHtml(t.title)+'</div></div>'+
            (t.description ? '<div class="task-desc">'+escHtml(t.description)+'</div>' : '')+
            '<div class="task-footer">'+
            '  <span class="priority-badge '+prio+'">'+prio+'</span>'+
            '  '+assign+
            '</div>'+
            '<div class="card-actions">'+
            '  <button class="card-btn" onclick="openEditModal('+t.id+')">✏️ Edit</button>'+
            '  <button class="card-btn danger" onclick="deleteTask('+t.id+')">🗑 Delete</button>'+
            '</div>';
        return div;
    }

    // ── Drag & Drop ─────────────────────────────────────────────────────────
    function onDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function onDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
    function onDrop(e, newStatus){
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        if(!dragId) return;
        authFetch('/tasks/' + dragId + '/status', {
            method: 'PATCH',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ status: newStatus })  // Sends: "TODO", "IN_PROGRESS", "DONE"
        }).then(function(){ loadBoard(); });
    }

    // ── Modal ───────────────────────────────────────────────────────────────
    function openCreateModal(){
        if(!document.getElementById('proj-select').value){ alert('Please select a project first.'); return; }
        document.getElementById('modal-title').textContent  = 'New Task';
        document.getElementById('edit-task-id').value       = '';
        document.getElementById('f-title').value            = '';
        document.getElementById('f-desc').value             = '';
        document.getElementById('f-priority').value         = 'MEDIUM';
        document.getElementById('f-status').value           = 'TODO';
        document.getElementById('f-assignee').value         = '';
        document.getElementById('comments-section').style.display = 'none';
        document.getElementById('task-modal').classList.add('open');
    }

    function openEditModal(taskId){
        var t = allTasks.find(function(x){ return x.id === taskId; });
        if(!t) return;
        document.getElementById('modal-title').textContent  = 'Edit Task';
        document.getElementById('edit-task-id').value       = t.id;
        document.getElementById('f-title').value            = t.title || '';
        document.getElementById('f-desc').value             = t.description || '';
        // Set priority — try uppercase first, fallback
        var prio = (t.priority||'MEDIUM').toUpperCase();
        document.getElementById('f-priority').value = prio;
        // Set status — map to column key
        document.getElementById('f-status').value   = colOf(t.status);
        document.getElementById('f-assignee').value = t.assignedToId || '';
        document.getElementById('comments-section').style.display = 'block';
        loadComments(taskId);
        document.getElementById('task-modal').classList.add('open');
    }

    function closeModal(){ document.getElementById('task-modal').classList.remove('open'); }

    document.getElementById('task-modal').addEventListener('click', function(e){
        if(e.target === this) closeModal();
    });

    // ── Save Task ────────────────────────────────────────────────────────────
    function saveTask(){
        var title = document.getElementById('f-title').value.trim();
        if(!title){ alert('Title is required.'); return; }

        var editId   = document.getElementById('edit-task-id').value;
        var projId   = document.getElementById('proj-select').value;
        var assignee = document.getElementById('f-assignee').value;

        var payload = {
            title:        title,
            description:  document.getElementById('f-desc').value.trim(),
            priority:     document.getElementById('f-priority').value,   // HIGH/MEDIUM/LOW
            status:       document.getElementById('f-status').value,     // TODO/IN_PROGRESS/DONE
            projectId:    projId   ? parseInt(projId)   : null,
            assignedToId: assignee ? parseInt(assignee) : null,
            createdById:  user.id
        };

        var url    = editId ? '/tasks/' + editId : '/tasks';
        var method = editId ? 'PUT' : 'POST';

        authFetch(url, {
            method: method,
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        }).then(function(r){ return r.json(); }).then(function(){
            closeModal(); loadBoard();
        }).catch(function(){ alert('Failed to save task.'); });
    }

    // ── Delete Task ──────────────────────────────────────────────────────────
    function deleteTask(taskId){
        if(!confirm('Delete this task? This cannot be undone.')) return;
        authFetch('/tasks/' + taskId, { method: 'DELETE' }).then(function(){ loadBoard(); });
    }

    // ── Comments ─────────────────────────────────────────────────────────────
    function loadComments(taskId){
        authFetch('/tasks/' + taskId + '/comments')
            .then(function(r){ return r.json(); })
            .then(function(comments){
                var list = document.getElementById('comment-list');
                if(!comments.length){
                    list.innerHTML = '<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:10px;">No comments yet</div>';
                    return;
                }
                list.innerHTML = comments.map(function(c){
                    return '<div class="comment-item">'
                        + '<div class="comment-meta">'
                        + '<span class="comment-author">'+escHtml(c.senderName||c.authorName||'User')+'</span>'
                        + '<span class="comment-role">('+escHtml(c.senderRole||c.role||'')+')</span>'
                        + '<span class="comment-time">'+fmtDate(c.createdAt||c.sentAt)+'</span>'
                        + '</div>'
                        + '<div class="comment-text">'+escHtml(c.content)+'</div>'
                        + '</div>';
                }).join('');
                list.scrollTop = list.scrollHeight;
            });
    }

    function sendComment(){
        var taskId  = document.getElementById('edit-task-id').value;
        var input   = document.getElementById('comment-input');
        var content = input.value.trim();
        if(!content || !taskId) return;
        authFetch('/tasks/' + taskId + '/comments', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ content: content, senderId: user.id })
        }).then(function(){ input.value = ''; loadComments(parseInt(taskId)); });
    }

    document.getElementById('comment-input').addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); sendComment(); }
    });
</script>
</body>
</html>

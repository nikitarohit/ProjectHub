<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — ProjectHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cyan: #00d4ff; --cyan-dim: rgba(0,212,255,0.12);
            --bg: #0d0f1a; --bg-card: rgba(255,255,255,0.04); --bg-card-hover: rgba(255,255,255,0.07);
            --border: rgba(255,255,255,0.08); --border-hover: rgba(0,212,255,0.3);
            --text-primary: #eef0ff; --text-secondary: rgba(200,210,240,0.55); --text-muted: rgba(200,210,240,0.3);
            --green: #22c97a; --amber: #f5a623; --sidebar-w: 240px;
            /* WhatsApp-style chat colors */
            --bubble-me: rgba(0,180,220,0.22);
            --bubble-me-border: rgba(0,212,255,0.25);
            --bubble-them: rgba(255,255,255,0.07);
            --bubble-them-border: rgba(255,255,255,0.1);
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; color: var(--text-primary); display: flex; }
        body::before { content: ''; position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 50% 60% at 5% 40%, rgba(0,100,180,0.14) 0%, transparent 65%); pointer-events: none; }
        body::after { content: ''; position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 48px 48px; pointer-events: none; }

        /* SIDEBAR */
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); background: rgba(10,13,28,0.9); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 20px; z-index: 10; backdrop-filter: blur(12px); }
        .sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
        .brand-icon { width: 34px; height: 34px; background: linear-gradient(135deg, var(--cyan), #4facfe); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .brand-icon svg { width: 18px; height: 18px; }
        .brand-name { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: var(--text-primary); }
        .nav-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); padding: 0 8px; margin-bottom: 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; color: var(--text-secondary); transition: all 0.2s; margin-bottom: 2px; text-decoration: none; }
        .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        .nav-item.active { background: var(--cyan-dim); color: var(--cyan); font-weight: 500; }
        .nav-item.danger { color: #ff5e5e; }
        .nav-item.danger:hover { background: rgba(255,94,94,0.1); }
        .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 20px; }
        .user-pill { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #00bfdf, #4facfe); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; color: #001830; flex-shrink: 0; }
        .user-info { flex: 1; min-width: 0; }
        .user-name-text { font-size: 13px; font-weight: 500; color: var(--text-primary); }
        .user-role-text { font-size: 11px; color: var(--text-muted); }

        /* MAIN */
        .main { margin-left: var(--sidebar-w); flex: 1; position: relative; z-index: 1; padding: 40px 44px; min-height: 100vh; display: flex; flex-direction: column; }

        /* TOPBAR */
        .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; animation: rise 0.6s cubic-bezier(0.22,1,0.36,1) both; }
        .back-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; color: var(--text-secondary); text-decoration: none; transition: all 0.2s; flex-shrink: 0; }
        .back-btn:hover { border-color: var(--border-hover); color: var(--cyan); background: var(--cyan-dim); }
        .back-btn svg { width: 16px; height: 16px; }
        .page-eyebrow { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan); margin-bottom: 4px; }
        .page-title { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: var(--text-primary); }

        /* TWO COLUMN */
        .content-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; flex: 1; animation: rise 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both; min-height: 520px; }

        /* PROJECT INFO */
        .info-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; position: relative; overflow: hidden; align-self: start; }
        .info-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--cyan), #4facfe); }
        .info-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
        .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; margin-bottom: 20px; }
        .status-badge .dot { width: 5px; height: 5px; border-radius: 50%; }
        .status-badge.active { background: rgba(34,201,122,0.12); color: var(--green); border: 1px solid rgba(34,201,122,0.25); }
        .status-badge.active .dot { background: var(--green); }
        .status-badge.pending { background: rgba(245,166,35,0.12); color: var(--amber); border: 1px solid rgba(245,166,35,0.25); }
        .status-badge.pending .dot { background: var(--amber); }
        .status-badge.completed { background: rgba(0,212,255,0.1); color: var(--cyan); border: 1px solid rgba(0,212,255,0.2); }
        .status-badge.completed .dot { background: var(--cyan); }
        .meta-grid { display: flex; flex-direction: column; gap: 10px; }
        .meta-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; }
        .meta-key { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
        .meta-val { font-size: 13px; font-weight: 500; color: var(--text-primary); }
        .meta-val.warn { color: var(--amber); }

        /* ═══════════════════════════════════════
           WHATSAPP-STYLE CHAT
           ═══════════════════════════════════════ */
        .chat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }

        /* Chat header */
        .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.02); }
        .chat-header-av { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #a78bfa, #7c3aed); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
        .chat-header-info { flex: 1; }
        .chat-header-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text-primary); }
        .chat-header-status { font-size: 11px; color: var(--green); display: flex; align-items: center; gap: 5px; }
        .chat-header-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }

        /* Messages area */
        .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; min-height: 360px; max-height: 480px; background: rgba(0,0,0,0.15); }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

        /* Date separator */
        .date-sep { display: flex; align-items: center; gap: 12px; margin: 12px 0 8px; }
        .date-sep span { font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 3px 12px; border-radius: 20px; white-space: nowrap; }
        .date-sep::before, .date-sep::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }

        /* Message rows */
        .msg-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 2px; }
        .msg-row.me { flex-direction: row-reverse; }

        /* Consecutive messages - hide avatar if same sender */
        .msg-row.consecutive .msg-av { visibility: hidden; }

        .msg-av { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; font-family: 'Syne', sans-serif; }
        .msg-av.me-av { background: linear-gradient(135deg, #00bfdf, #4facfe); color: #001830; }
        .msg-av.them-av { background: linear-gradient(135deg, #a78bfa, #7c3aed); color: white; }

        .msg-content { max-width: 65%; display: flex; flex-direction: column; gap: 2px; }
        .msg-row.me .msg-content { align-items: flex-end; }

        /* Sender name (only show for first in group) */
        .msg-sender-name { font-size: 11px; font-weight: 500; color: var(--cyan); padding: 0 4px; display: none; }
        .msg-row:not(.consecutive) .msg-sender-name { display: block; }
        .msg-row.me .msg-sender-name { color: #4facfe; }

        /* Bubble */
        .msg-bubble { padding: 9px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.5; word-break: break-word; position: relative; }
        .msg-row.me .msg-bubble {
            background: linear-gradient(135deg, var(--bubble-me), rgba(79,172,254,0.18));
            border: 1px solid var(--bubble-me-border);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }
        .msg-row:not(.me) .msg-bubble {
            background: var(--bubble-them);
            border: 1px solid var(--bubble-them-border);
            color: var(--text-secondary);
            border-bottom-left-radius: 4px;
        }

        /* Timestamp + tick */
        .msg-meta { display: flex; align-items: center; gap: 4px; padding: 0 4px; }
        .msg-time { font-size: 10px; color: var(--text-muted); }
        .msg-tick { font-size: 12px; color: var(--cyan); opacity: 0.7; }

        /* Typing indicator */
        .typing-indicator { display: none; align-items: center; gap: 8px; padding: 4px 0; }
        .typing-indicator.show { display: flex; }
        .typing-dots { display: flex; gap: 4px; }
        .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: blink 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }

        /* Empty state */
        .chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 10px; padding: 40px; text-align: center; }
        .chat-empty svg { width: 40px; height: 40px; opacity: 0.25; }
        .chat-empty p { font-size: 13px; }

        /* Input area */
        .chat-input-area { padding: 14px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; background: rgba(255,255,255,0.02); }
        .chat-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 22px; padding: 10px 16px; color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 13.5px; outline: none; resize: none; transition: all 0.2s; line-height: 1.5; max-height: 120px; }
        .chat-input::placeholder { color: var(--text-muted); }
        .chat-input:focus { border-color: rgba(0,212,255,0.4); background: rgba(0,212,255,0.04); }
        .send-btn { width: 42px; height: 42px; background: linear-gradient(135deg, #00bfdf, #4facfe); border: none; border-radius: 50%; color: #001830; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(0,212,255,0.4); }
        .send-btn:active { transform: scale(0.96); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .send-btn svg { width: 18px; height: 18px; }

        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop-in { from { opacity: 0; transform: scale(0.85) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .msg-row { animation: pop-in 0.2s ease both; }

        @media (max-width: 900px) { .sidebar { display: none; } .main { margin-left: 0; padding: 24px 20px; } .content-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <p class="nav-label">Menu</p>
    <a class="nav-item" href="index.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</a>
    <a class="nav-item active" href="MyProjects.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>My Projects</a>
    <a class="nav-item" href="deadlines.html"><svg viewBox="0 0 16 16" fill="none"><path d="M8 1v6l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/></svg>Deadlines</a>
    <a class="nav-item" href="Messages.html"><svg viewBox="0 0 16 16" fill="none"><path d="M14 10.667c0 .344-.077.683-.226.995a2.59 2.59 0 01-.627.845c-.38.344-.793.516-1.214.516-.306 0-.638-.09-.99-.272L8 10.667l-2.943 2.084c-.352.181-.684.272-.99.272-.421 0-.835-.172-1.214-.516a2.59 2.59 0 01-.627-.845A2.432 2.432 0 012 10.667V4a2 2 0 012-2h8a2 2 0 012 2v6.667z" stroke="currentColor" stroke-width="1.4"/></svg>Messages</a>
    <a class="nav-item" href="Profile.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Profile</a>
    <div class="sidebar-bottom">
        <div class="user-pill">
            <div class="avatar" id="sb-avatar">?</div>
            <div class="user-info">
                <div class="user-name-text" id="sb-user-name">Loading…</div>
                <div class="user-role-text" id="sb-user-role">client</div>
            </div>
        </div>
        <a class="nav-item danger" href="#" onclick="logout()" style="margin-top:8px;">
            <svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Logout
        </a>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <a class="back-btn" href="index.html">
            <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div>
            <p class="page-eyebrow">Project Details</p>
            <h1 class="page-title" id="page-title">Loading…</h1>
        </div>
    </div>

    <div class="content-grid">
        <!-- LEFT: Project Info -->
        <div class="info-card">
            <div class="info-title" id="proj-title">—</div>
            <div id="proj-status-wrap"></div>
            <div class="meta-grid" id="proj-meta">
                <div style="height:44px;background:rgba(255,255,255,0.05);border-radius:8px;animation:pulse 1.5s infinite;"></div>
                <div style="height:44px;background:rgba(255,255,255,0.05);border-radius:8px;animation:pulse 1.5s infinite;animation-delay:.1s;"></div>
            </div>
        </div>

        <!-- RIGHT: WhatsApp Chat -->
        <div class="chat-card">
            <div class="chat-header">
                <div class="chat-header-av" id="chat-av">AD</div>
                <div class="chat-header-info">
                    <div class="chat-header-name">Project Chat</div>
                    <div class="chat-header-status">Online</div>
                </div>
            </div>

            <div class="messages-area" id="messages-area">
                <div class="chat-empty">
                    <svg viewBox="0 0 40 40" fill="none"><path d="M33 26.667c0 .688-.154 1.366-.452 1.989a5.18 5.18 0 01-1.254 1.69c-.76.688-1.586 1.032-2.427 1.032-.613 0-1.277-.18-1.981-.544L20 28l-6.887 4.167c-.703.363-1.368.544-1.98.544-.842 0-1.67-.344-2.428-1.032a5.18 5.18 0 01-1.253-1.69A4.865 4.865 0 017 26.667V10a4 4 0 014-4h18a4 4 0 014 4v16.667z" stroke="currentColor" stroke-width="1.5"/></svg>
                    <p>No messages yet. Say hello! 👋</p>
                </div>
            </div>

            <div class="typing-indicator" id="typing">
                <div class="msg-av them-av" style="visibility:visible;">AD</div>
                <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>

            <div class="chat-input-area">
                <textarea class="chat-input" id="msg-input" placeholder="Type a message…" rows="1" onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 18 18" fill="none"><path d="M15.5 2.5L8 10M15.5 2.5L10.5 15.5L8 10L2.5 7.5L15.5 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </div>
    </div>
</main>

<script>
    // ── Session & URL params ──────────────────────────────────
    const user      = getUser();
    const projectId = new URLSearchParams(window.location.search).get('id');

    if (!projectId) window.location.href = 'index.html';
    if (user) fillSidebarUser(user);

    let lastSenderId  = null;
    let lastDateLabel = null;
    let pollInterval  = null;

    // ── Load project details ──────────────────────────────────
    authFetch(`/projects/${projectId}`)
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(renderProject)
        .catch(() => {
            document.getElementById('page-title').textContent = 'Project not found';
        });

    function renderProject(p) {
        document.getElementById('page-title').textContent  = p.title;
        document.getElementById('proj-title').textContent  = p.title;

        const sc = statusClass(p.status);
        document.getElementById('proj-status-wrap').innerHTML =
            `<span class="status-badge ${sc}"><span class="dot"></span>${p.status}</span>`;

        const days = daysUntil(p.deadline);
        const warn = days !== null && days <= 14 && days >= 0;
        const daysLabel = days === null ? '—' : days > 0 ? days + ' days' : days === 0 ? 'Today!' : 'Overdue';

        document.getElementById('proj-meta').innerHTML = `
            <div class="meta-row">
                <span class="meta-key">Deadline</span>
                <span class="meta-val ${warn ? 'warn' : ''}">${formatDate(p.deadline)}${warn ? ' ⚡' : ''}</span>
            </div>
            <div class="meta-row">
                <span class="meta-key">Days Left</span>
                <span class="meta-val ${warn ? 'warn' : ''}">${daysLabel}</span>
            </div>
            <div class="meta-row">
                <span class="meta-key">Status</span>
                <span class="meta-val">${p.status}</span>
            </div>
            ${p.description ? `<div class="meta-row" style="flex-direction:column;align-items:flex-start;gap:4px;">
                <span class="meta-key">Description</span>
                <span style="font-size:12.5px;color:var(--text-secondary);line-height:1.5;">${p.description}</span>
            </div>` : ''}`;
    }

    // ── Load messages ─────────────────────────────────────────
    function loadMessages(isInitial = false) {
        authFetch(`/messages/project/${projectId}`)
            .then(r => { if (!r.ok) throw new Error(); return r.json(); })
            .then(data => renderMessages(data, isInitial))
            .catch(() => {
                if (isInitial) {
                    document.getElementById('messages-area').innerHTML =
                        `<div class="chat-empty"><p>Failed to load messages.</p></div>`;
                }
            });
    }

    function renderMessages(data, scrollToBottom = false) {
        const area = document.getElementById('messages-area');

        if (!data || data.length === 0) {
            area.innerHTML = `
                <div class="chat-empty">
                    <svg viewBox="0 0 40 40" fill="none"><path d="M33 26.667c0 .688-.154 1.366-.452 1.989a5.18 5.18 0 01-1.254 1.69c-.76.688-1.586 1.032-2.427 1.032-.613 0-1.277-.18-1.981-.544L20 28l-6.887 4.167c-.703.363-1.368.544-1.98.544-.842 0-1.67-.344-2.428-1.032a5.18 5.18 0 01-1.253-1.69A4.865 4.865 0 017 26.667V10a4 4 0 014-4h18a4 4 0 014 4v16.667z" stroke="currentColor" stroke-width="1.5"/></svg>
                    <p>No messages yet. Say hello! 👋</p>
                </div>`;
            return;
        }

        // Check if new messages arrived (avoid full re-render flicker on poll)
        const currentCount = area.querySelectorAll('.msg-row').length;
        if (!scrollToBottom && currentCount === data.length) return; // nothing new

        area.innerHTML = '';
        lastSenderId  = null;
        lastDateLabel = null;

        data.forEach(m => {
            const isMe = m.senderName === user.name;
            const dateLabel = getDateLabel(m.timestamp);

            // Date separator
            if (dateLabel !== lastDateLabel) {
                const sep = document.createElement('div');
                sep.className = 'date-sep';
                sep.innerHTML = `<span>${dateLabel}</span>`;
                area.appendChild(sep);
                lastDateLabel = dateLabel;
                lastSenderId  = null; // reset grouping on new day
            }

            // Is this consecutive from same sender?
            const isConsecutive = lastSenderId === m.senderName;
            lastSenderId = m.senderName;

            const row = document.createElement('div');
            row.className = `msg-row ${isMe ? 'me' : ''} ${isConsecutive ? 'consecutive' : ''}`;

            const avInitials = getInitials(m.senderName);
            const avClass    = isMe ? 'me-av' : 'them-av';

            row.innerHTML = `
                <div class="msg-av ${avClass}">${avInitials}</div>
                <div class="msg-content">
                    <span class="msg-sender-name">${m.senderName}</span>
                    <div class="msg-bubble">${escapeHtml(m.content)}</div>
                    <div class="msg-meta">
                        <span class="msg-time">${formatTime(m.timestamp)}</span>
                        ${isMe ? '<span class="msg-tick">✓✓</span>' : ''}
                    </div>
                </div>`;

            area.appendChild(row);
        });

        // Always scroll to bottom when new messages arrive
        area.scrollTop = area.scrollHeight;
    }

    // ── Send message ──────────────────────────────────────────
    async function sendMessage() {
        const input = document.getElementById('msg-input');
        const msg   = input.value.trim();
        if (!msg) return;

        const btn = document.getElementById('send-btn');
        btn.disabled = true;

        try {
            const res = await authFetch('/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: msg,
                    project: { id: parseInt(projectId) },
                    sender:  { id: user.id }
                })
            });

            if (!res.ok) throw new Error();

            input.value = '';
            input.style.height = 'auto';
            loadMessages(true); // reload all messages

        } catch (e) {
            alert('Failed to send message. Check your connection.');
        } finally {
            btn.disabled = false;
            input.focus();
        }
    }

    // ── Helpers ───────────────────────────────────────────────
    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function getDateLabel(ts) {
        if (!ts) return '';
        const d   = new Date(ts);
        const now = new Date();
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);

        if (d.toDateString() === now.toDateString())       return 'Today';
        if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(text));
        return d.innerHTML;
    }

    // Auto-resize textarea
    document.getElementById('msg-input').addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // ── Init ──────────────────────────────────────────────────
    loadMessages(true);
    // Poll for new messages every 5 seconds (real-time feel)
    pollInterval = setInterval(() => loadMessages(false), 5000);

    // Clean up on page leave
    window.addEventListener('beforeunload', () => clearInterval(pollInterval));
</script>
</body>
</html>

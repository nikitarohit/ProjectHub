<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var r=localStorage.getItem('user');if(!r){window.location.replace('login.html');return;}var u=JSON.parse(r);if(u.role!=='admin')window.location.replace('index.html');})();</script>
    <script src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients — ProjectHub Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cyan:#00d4ff; --cyan-dim:rgba(0,212,255,0.12);
            --bg:#0d0f1a; --bg-card:rgba(255,255,255,0.04); --bg-hover:rgba(255,255,255,0.07);
            --border:rgba(255,255,255,0.08); --border-hover:rgba(0,212,255,0.3);
            --text-primary:#eef0ff; --text-secondary:rgba(200,210,240,0.55); --text-muted:rgba(200,210,240,0.3);
            --green:#22c97a; --amber:#f5a623; --red:#ff5e5e; --purple:#a78bfa; --sidebar-w:240px;
        }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); min-height:100vh; color:var(--text-primary); display:flex; }
        body::before { content:''; position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse 50% 60% at 5% 40%,rgba(80,0,180,0.1) 0%,transparent 65%); pointer-events:none; }
        body::after  { content:''; position:fixed; inset:0; z-index:0; background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px); background-size:48px 48px; pointer-events:none; }

        .sidebar { position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w); background:rgba(10,13,28,0.92); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:28px 20px; z-index:10; backdrop-filter:blur(12px); }
        .sidebar-brand { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
        .brand-icon { width:34px; height:34px; background:linear-gradient(135deg,var(--cyan),#4facfe); border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .brand-icon svg { width:18px; height:18px; }
        .brand-name { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; color:var(--text-primary); }
        .admin-chip { font-size:9px; background:rgba(167,139,250,0.15); color:var(--purple); border:1px solid rgba(167,139,250,0.25); padding:2px 8px; border-radius:10px; font-weight:700; letter-spacing:0.08em; display:inline-block; margin-left:44px; margin-bottom:28px; }
        .nav-label { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-muted); padding:0 8px; margin-bottom:8px; }
        .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; font-size:13.5px; color:var(--text-secondary); transition:all 0.2s; margin-bottom:2px; text-decoration:none; }
        .nav-item svg { width:16px; height:16px; flex-shrink:0; opacity:0.7; }
        .nav-item:hover { background:rgba(255,255,255,0.05); color:var(--text-primary); }
        .nav-item.active { background:var(--cyan-dim); color:var(--cyan); font-weight:500; }
        .nav-item.active svg { opacity:1; }
        .nav-item.danger { color:var(--red); }
        .nav-item.danger:hover { background:rgba(255,94,94,0.1); }
        .sidebar-bottom { margin-top:auto; border-top:1px solid var(--border); padding-top:18px; }
        .user-pill { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid var(--border); margin-bottom:8px; }
        .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#a78bfa,#7c3aed); display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-size:12px; font-weight:700; color:white; flex-shrink:0; }
        .user-name-text { font-size:13px; font-weight:500; color:var(--text-primary); }
        .user-role-text { font-size:11px; color:var(--purple); }

        .main { margin-left:var(--sidebar-w); flex:1; position:relative; z-index:1; padding:40px 44px; }
        .topbar { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; animation:rise 0.6s cubic-bezier(0.22,1,0.36,1) both; }
        .page-eyebrow { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--cyan); margin-bottom:6px; }
        .page-title { font-family:'Syne',sans-serif; font-size:30px; font-weight:800; letter-spacing:-0.6px; color:var(--text-primary); }
        .badge-count { background:var(--cyan-dim); border:1px solid rgba(0,212,255,0.2); color:var(--cyan); font-size:12px; font-weight:500; padding:5px 14px; border-radius:20px; }

        /* CLIENTS GRID */
        .clients-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; animation:rise 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both; }

        .client-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:24px; transition:all 0.25s; position:relative; overflow:hidden; }
        .client-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--cyan),#4facfe); opacity:0; transition:opacity 0.25s; }
        .client-card:hover { border-color:var(--border-hover); background:var(--bg-hover); transform:translateY(-2px); }
        .client-card:hover::before { opacity:1; }

        .client-top { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
        .client-av { width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#00bfdf,#4facfe); display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-size:16px; font-weight:700; color:#001830; flex-shrink:0; }
        .client-name { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; color:var(--text-primary); }
        .client-email { font-size:12px; color:var(--text-muted); margin-top:2px; }

        .client-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
        .cstat { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); border-radius:8px; padding:10px 12px; }
        .cstat-val { font-family:'Syne',sans-serif; font-size:20px; font-weight:700; color:var(--text-primary); }
        .cstat-lbl { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); margin-top:2px; }

        .projects-section-title { font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-muted); margin-bottom:8px; }
        .project-pill { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); border-radius:8px; margin-bottom:6px; text-decoration:none; transition:background 0.2s; }
        .project-pill:hover { background:rgba(0,212,255,0.06); border-color:rgba(0,212,255,0.15); }
        .project-pill-name { font-size:13px; color:var(--text-primary); }
        .status-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
        .status-dot.active    { background:var(--green); }
        .status-dot.pending   { background:var(--amber); }
        .status-dot.completed { background:var(--cyan); }

        .empty-state { padding:60px 20px; text-align:center; color:var(--text-muted); font-size:13px; grid-column:1/-1; }
        .skel { background:rgba(255,255,255,0.05); border-radius:16px; height:220px; animation:pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
        @keyframes rise  { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
        @media (max-width:900px) { .sidebar{display:none} .main{margin-left:0;padding:24px 20px} .clients-grid{grid-template-columns:1fr} }
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <span class="admin-chip">ADMIN PANEL</span>
    <p class="nav-label">Admin</p>
    <a class="nav-item" href="Admin.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</a>
    <a class="nav-item" href="AllProjects.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>All Projects</a>
    <a class="nav-item" href="TaskBoard.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="6" y="1" width="4" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="1" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>Task Board</a>
    <a class="nav-item active" href="Clients.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Clients</a>
    <a class="nav-item" href="AdminMessages.html"><svg viewBox="0 0 16 16" fill="none"><path d="M14 10.667c0 .344-.077.683-.226.995a2.59 2.59 0 01-.627.845c-.38.344-.793.516-1.214.516-.306 0-.638-.09-.99-.272L8 10.667l-2.943 2.084c-.352.181-.684.272-.99.272-.421 0-.835-.172-1.214-.516a2.59 2.59 0 01-.627-.845A2.432 2.432 0 012 10.667V4a2 2 0 012-2h8a2 2 0 012 2v6.667z" stroke="currentColor" stroke-width="1.4"/></svg>Messages</a>
    <a class="nav-item" href="CreateProject.html"><svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Create Project</a>
    <div class="sidebar-bottom">
        <div class="user-pill"><div class="avatar" id="sb-avatar">AD</div><div><div class="user-name-text" id="sb-user-name">Admin</div><div class="user-role-text" id="sb-user-role">admin</div></div></div>
        <a class="nav-item danger" href="#" onclick="logout()"><svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <div><p class="page-eyebrow">Admin</p><h1 class="page-title">Clients</h1></div>
        <span class="badge-count" id="client-count">Loading…</span>
    </div>
    <div class="clients-grid" id="clients-grid">
        <div class="skel"></div>
        <div class="skel" style="animation-delay:.15s"></div>
    </div>
</main>

<script>
    const user = requireAdmin();
    if (user) { fillSidebarUser(user); document.getElementById('sb-user-role').style.color = 'var(--purple)'; }

    async function load() {
        const [uRes, pRes] = await Promise.all([authFetch('/users'), authFetch('/projects')]);
        const users    = await uRes.json();
        const projects = await pRes.json();
        const clients  = users.filter(u => u.role === 'client');

        document.getElementById('client-count').textContent = clients.length + ' client' + (clients.length !== 1 ? 's' : '');

        const grid = document.getElementById('clients-grid');
        if (!clients.length) {
            grid.innerHTML = '<div class="empty-state">No clients registered yet.<br>Clients can sign up from the Login page.</div>';
            return;
        }

        grid.innerHTML = clients.map(c => {
            const clientProjects = projects.filter(p => p.client && p.client.id === c.id);
            const activeCount    = clientProjects.filter(p => statusClass(p.status) === 'active').length;

            const projectPills = clientProjects.map(p =>
                `<a class="project-pill" href="Project.html?id=${p.id}">
                    <span class="project-pill-name">${p.title}</span>
                    <span class="status-dot ${statusClass(p.status)}"></span>
                </a>`
            ).join('') || '<div style="font-size:12px;color:var(--text-muted);padding:4px 0;">No projects assigned</div>';

            return `<div class="client-card">
                <div class="client-top">
                    <div class="client-av">${getInitials(c.name)}</div>
                    <div>
                        <div class="client-name">${c.name}</div>
                        <div class="client-email">${c.email}</div>
                    </div>
                </div>
                <div class="client-stats">
                    <div class="cstat"><div class="cstat-val">${clientProjects.length}</div><div class="cstat-lbl">Projects</div></div>
                    <div class="cstat"><div class="cstat-val">${activeCount}</div><div class="cstat-lbl">Active</div></div>
                </div>
                <div class="projects-section-title">Projects</div>
                ${projectPills}
            </div>`;
        }).join('');
    }

    load();
</script>
</body>
</html>

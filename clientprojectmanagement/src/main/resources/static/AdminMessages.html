<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var r=localStorage.getItem('user');if(!r){window.location.replace('login.html');return;}var u=JSON.parse(r);if(u.role!=='admin')window.location.replace('index.html');})();</script>
    <script src="auth.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — ProjectHub Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.12);--bg:#0d0f1a;--bg-card:rgba(255,255,255,0.04);--bg-hover:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.08);--border-hover:rgba(0,212,255,0.3);--text-primary:#eef0ff;--text-secondary:rgba(200,210,240,0.55);--text-muted:rgba(200,210,240,0.3);--green:#22c97a;--amber:#f5a623;--red:#ff5e5e;--purple:#a78bfa;--sidebar-w:240px}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text-primary);display:flex}
        body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 60% at 5% 40%,rgba(80,0,180,0.1) 0%,transparent 65%);pointer-events:none}
        body::after{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:rgba(10,13,28,0.92);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 20px;z-index:10;backdrop-filter:blur(12px)}
        .sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--cyan),#4facfe);border-radius:8px;display:flex;align-items:center;justify-content:center}
        .brand-icon svg{width:18px;height:18px}
        .brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text-primary)}
        .admin-chip{font-size:9px;background:rgba(167,139,250,0.15);color:var(--purple);border:1px solid rgba(167,139,250,0.25);padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:0.08em;display:inline-block;margin-left:44px;margin-bottom:28px}
        .nav-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin-bottom:8px}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);transition:all 0.2s;margin-bottom:2px;text-decoration:none}
        .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.7}
        .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text-primary)}
        .nav-item.active{background:var(--cyan-dim);color:var(--cyan);font-weight:500}
        .nav-item.active svg{opacity:1}
        .nav-item.danger{color:var(--red)}
        .nav-item.danger:hover{background:rgba(255,94,94,0.1)}
        .sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:18px}
        .user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:8px}
        .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:white;flex-shrink:0}
        .user-name-text{font-size:13px;font-weight:500;color:var(--text-primary)}
        .user-role-text{font-size:11px;color:var(--purple)}
        .main{margin-left:var(--sidebar-w);flex:1;position:relative;z-index:1;padding:40px 44px;min-height:100vh;display:flex;flex-direction:column}
        .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;animation:rise 0.6s cubic-bezier(0.22,1,0.36,1) both}
        .page-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
        .page-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.6px;color:var(--text-primary)}

        /* LAYOUT */
        .msg-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;flex:1;animation:rise 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both;min-height:560px}
        .thread-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}

        /* Tab switcher in thread panel */
        .thread-tabs{display:flex;border-bottom:1px solid var(--border)}
        .thread-tab{flex:1;padding:10px;font-size:12px;font-weight:500;cursor:pointer;text-align:center;color:var(--text-muted);transition:all 0.2s;border:none;background:transparent}
        .thread-tab.active{color:var(--cyan);background:var(--cyan-dim);border-bottom:2px solid var(--cyan)}
        .thread-tab:hover:not(.active){color:var(--text-secondary);background:var(--bg-hover)}

        .thread-list{overflow-y:auto;flex:1}
        .thread-item{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.03);cursor:pointer;transition:background 0.2s;position:relative}
        .thread-item:last-child{border-bottom:none}
        .thread-item:hover{background:var(--bg-hover)}
        .thread-item.active{background:var(--cyan-dim);border-left:2px solid var(--cyan)}
        .thread-av{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--text-secondary);flex-shrink:0}
        .thread-av.c{background:var(--cyan-dim);color:var(--cyan)}
        .thread-av.g{background:rgba(167,139,250,0.15);color:var(--purple)}
        .thread-name{font-size:13px;font-weight:500;color:var(--text-primary)}
        .thread-sub{font-size:11px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
        .thread-info{flex:1;min-width:0}

        /* NEW badge */
        .new-badge{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}

        /* CHAT */
        .chat-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
        .chat-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.02)}
        .chat-header-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#00bfdf,#4facfe);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#001830;flex-shrink:0}
        .chat-header-av.general{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:white}
        .chat-header-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text-primary)}
        .chat-header-sub{font-size:11px;color:var(--text-muted)}
        .online-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:auto;box-shadow:0 0 6px var(--green)}

        /* General chat notice */
        .general-notice{background:rgba(167,139,250,0.08);border-bottom:1px solid rgba(167,139,250,0.15);padding:8px 20px;font-size:12px;color:rgba(167,139,250,0.8);display:none}
        .general-notice.show{display:block}

        .messages-area{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth;min-height:300px;max-height:440px;background:rgba(0,0,0,0.15)}
        .messages-area::-webkit-scrollbar{width:4px}
        .messages-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:99px}
        .date-sep{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
        .date-sep span{font-size:10px;color:var(--text-muted);background:rgba(255,255,255,0.05);padding:3px 10px;border-radius:20px;white-space:nowrap}
        .date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06)}
        .msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:2px;animation:pop 0.2s ease both}
        .msg-row.me{flex-direction:row-reverse}
        .msg-row.consec .msg-av{visibility:hidden}
        .msg-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;font-family:'Syne',sans-serif}
        .msg-av.me-av{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:white}
        .msg-av.them-av{background:linear-gradient(135deg,#00bfdf,#4facfe);color:#001830}
        .msg-wrap{max-width:65%;display:flex;flex-direction:column;gap:2px}
        .msg-row.me .msg-wrap{align-items:flex-end}
        .msg-sender{font-size:10px;font-weight:500;padding:0 4px;display:none}
        .msg-row:not(.consec) .msg-sender{display:block}
        .msg-row.me .msg-sender{color:var(--purple)}
        .msg-row:not(.me) .msg-sender{color:var(--cyan)}
        .msg-bubble{padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
        .msg-row.me .msg-bubble{background:linear-gradient(135deg,rgba(167,139,250,0.22),rgba(124,58,237,0.18));border:1px solid rgba(167,139,250,0.3);color:var(--text-primary);border-bottom-right-radius:4px}
        .msg-row:not(.me) .msg-bubble{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--text-secondary);border-bottom-left-radius:4px}
        .msg-meta{display:flex;align-items:center;gap:4px;padding:0 4px}
        .msg-time{font-size:10px;color:var(--text-muted)}
        .msg-tick{font-size:11px;color:var(--purple);opacity:0.7}
        .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);gap:10px;padding:40px;text-align:center}
        .placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-muted);padding:40px;text-align:center}
        .placeholder svg{width:40px;height:40px;opacity:0.2}
        .chat-input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;background:rgba(255,255,255,0.02)}
        .chat-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:22px;padding:10px 16px;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:13.5px;outline:none;resize:none;transition:all 0.2s;max-height:100px}
        .chat-input::placeholder{color:var(--text-muted)}
        .chat-input:focus{border-color:rgba(167,139,250,0.4);background:rgba(167,139,250,0.04)}
        .send-btn{width:40px;height:40px;background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:50%;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
        .send-btn:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(167,139,250,0.5)}
        .send-btn svg{width:17px;height:17px}
        .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
        @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        @keyframes pop{from{opacity:0;transform:scale(0.88) translateY(6px)}to{opacity:1;transform:none}}
        @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:24px 20px}.msg-layout{grid-template-columns:1fr}}
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><svg viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.7"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5" fill="#001830" opacity="0.4"/></svg></div>
        <span class="brand-name">ProjectHub</span>
    </div>
    <span class="admin-chip">ADMIN PANEL</span>
    <p class="nav-label">Admin</p>
    <a class="nav-item" href="Admin.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</a>
    <a class="nav-item" href="AllProjects.html"><svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>All Projects</a>
    <a class="nav-item" href="TaskBoard.html"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="6" y="1" width="4" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="1" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>Task Board</a>
    <a class="nav-item" href="Clients.html"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2.485 2.686-4.5 6-4.5s6 2.015 6 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Clients</a>
    <a class="nav-item active" href="AdminMessages.html"><svg viewBox="0 0 16 16" fill="none"><path d="M14 10.667c0 .344-.077.683-.226.995a2.59 2.59 0 01-.627.845c-.38.344-.793.516-1.214.516-.306 0-.638-.09-.99-.272L8 10.667l-2.943 2.084c-.352.181-.684.272-.99.272-.421 0-.835-.172-1.214-.516a2.59 2.59 0 01-.627-.845A2.432 2.432 0 012 10.667V4a2 2 0 012-2h8a2 2 0 012 2v6.667z" stroke="currentColor" stroke-width="1.4"/></svg>Messages</a>
    <a class="nav-item" href="CreateProject.html"><svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Create Project</a>
    <div class="sidebar-bottom">
        <div class="user-pill"><div class="avatar" id="sb-avatar">AD</div><div><div class="user-name-text" id="sb-name">Admin</div><div class="user-role-text">admin</div></div></div>
        <a class="nav-item danger" href="#" onclick="doLogout()"><svg viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <div><p class="page-eyebrow">Admin</p><h1 class="page-title">Messages</h1></div>
    </div>
    <div class="msg-layout">
        <!-- Thread List -->
        <div class="thread-panel">
            <div class="thread-tabs">
                <button class="thread-tab active" id="tab-general" onclick="switchTab('general')">💬 Client Inbox</button>
                <button class="thread-tab" id="tab-projects" onclick="switchTab('projects')">📁 Projects</button>
            </div>
            <div class="thread-list" id="thread-list"></div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-panel">
            <!-- Placeholder -->
            <div class="placeholder" id="placeholder">
                <svg viewBox="0 0 40 40" fill="none"><path d="M33 26c0 .7-.15 1.4-.45 2a5 5 0 01-1.25 1.7c-.76.69-1.59 1.03-2.43 1.03-.61 0-1.28-.18-1.98-.54L20 27l-6.89 3.2c-.7.35-1.37.54-1.98.54-.84 0-1.67-.34-2.43-1.03A5 5 0 017.45 28C7.15 27.4 7 26.7 7 26V10a4 4 0 014-4h18a4 4 0 014 4v16z" stroke="currentColor" stroke-width="1.5"/></svg>
                <p style="font-size:13px;">Select a conversation</p>
            </div>

            <!-- Active Chat -->
            <div id="chat-content" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
                <div class="chat-header">
                    <div class="chat-header-av" id="chat-av">?</div>
                    <div>
                        <div class="chat-header-name" id="chat-name">—</div>
                        <div class="chat-header-sub"  id="chat-sub">—</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
                <div class="general-notice" id="general-notice">💡 This is a general inquiry from a new client — no project assigned yet.</div>
                <div class="messages-area" id="msg-area"></div>
                <div class="chat-input-area">
                    <textarea class="chat-input" id="msg-input" placeholder="Reply as Admin…" rows="1" onkeydown="handleKey(event)"></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMsg()">
                        <svg viewBox="0 0 18 18" fill="none"><path d="M15.5 2.5L8 10M15.5 2.5L10.5 15.5L8 10L2.5 7.5L15.5 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    var user = JSON.parse(localStorage.getItem('user'));
    var allProjects=[], allUsers=[], allGeneral=[];
    var activeType=null, activeId=null, pollTimer=null;
    var currentTab='general';

    function initials(n){if(!n)return'?';return n.trim().split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
    function fmtTime(ts){if(!ts)return'';return new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
    function getDateLabel(ts){if(!ts)return'';var d=new Date(ts),now=new Date(),yes=new Date(now);yes.setDate(yes.getDate()-1);if(d.toDateString()===now.toDateString())return'Today';if(d.toDateString()===yes.toDateString())return'Yesterday';return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
    function escHtml(t){var d=document.createElement('div');d.appendChild(document.createTextNode(t||''));return d.innerHTML;}
    function doLogout(){localStorage.removeItem('user');window.location.replace('login.html');}

    document.getElementById('sb-name').textContent   = user.name||'Admin';
    document.getElementById('sb-avatar').textContent = initials(user.name);

    // Load everything
    Promise.all([
        authFetch('/projects').then(function(r){return r.json();}),
        authFetch('/users').then(function(r){return r.json();}),
        authFetch('/general-messages').then(function(r){return r.json();})
    ]).then(function(results){
        allProjects = results[0];
        allUsers    = results[1];
        allGeneral  = results[2];
        renderThreads();
    }).catch(function(){});

    function switchTab(tab){
        currentTab=tab;
        document.getElementById('tab-general').classList.toggle('active',tab==='general');
        document.getElementById('tab-projects').classList.toggle('active',tab==='projects');
        renderThreads();
    }

    function renderThreads(){
        var el = document.getElementById('thread-list');

        if(currentTab==='general'){
            // Group general messages by clientId — show unique clients
            var clientMap={};
            allGeneral.forEach(function(m){
                if(!clientMap[m.clientId]) clientMap[m.clientId]={clientId:m.clientId,msgs:[]};
                clientMap[m.clientId].msgs.push(m);
            });
            var clients = Object.values(clientMap);

            if(!clients.length){
                el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No client inquiries yet</div>';
                return;
            }

            el.innerHTML = clients.map(function(c){
                var clientUser = allUsers.find(function(u){return u.id===c.clientId;})||{name:'Client #'+c.clientId};
                var lastMsg    = c.msgs[c.msgs.length-1];
                var isActive   = activeType==='general' && activeId===c.clientId;
                return '<div class="thread-item'+(isActive?' active':'')+'" onclick="selectGeneral('+c.clientId+',\''+escHtml(clientUser.name)+'\')">'
                    +'<div class="thread-av g">'+initials(clientUser.name)+'</div>'
                    +'<div class="thread-info">'
                    +'<div class="thread-name">'+clientUser.name+'</div>'
                    +'<div class="thread-sub">'+(lastMsg?lastMsg.content.substring(0,40)+'…':'No messages')+'</div>'
                    +'</div>'
                    +'</div>';
            }).join('');

        } else {
            // Project chats
            if(!allProjects.length){
                el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No projects yet</div>';
                return;
            }
            el.innerHTML = allProjects.map(function(p){
                var clientUser = p.client ? (allUsers.find(function(u){return u.id===p.client.id;})||{name:'?'}) : {name:'?'};
                var isActive   = activeType==='project' && activeId===p.id;
                return '<div class="thread-item'+(isActive?' active':'')+'" onclick="selectProject('+p.id+',\''+escHtml(p.title)+'\',\''+escHtml(clientUser.name)+'\')">'
                    +'<div class="thread-av c">'+initials(p.title)+'</div>'
                    +'<div class="thread-info">'
                    +'<div class="thread-name">'+p.title+'</div>'
                    +'<div class="thread-sub">'+clientUser.name+'</div>'
                    +'</div>'
                    +'</div>';
            }).join('');
        }
    }

    function selectGeneral(clientId, clientName){
        activeType='general'; activeId=clientId;
        document.getElementById('chat-av').textContent       = initials(clientName);
        document.getElementById('chat-av').className        = 'chat-header-av general';
        document.getElementById('chat-name').textContent     = clientName;
        document.getElementById('chat-sub').textContent      = 'General inquiry — no project assigned';
        document.getElementById('general-notice').classList.add('show');
        showChat();
        loadGeneralMsgs(true);
        clearInterval(pollTimer);
        pollTimer = setInterval(function(){ loadGeneralMsgs(false); }, 5000);
        renderThreads();
    }

    function selectProject(projectId, title, clientName){
        activeType='project'; activeId=projectId;
        document.getElementById('chat-av').textContent       = initials(title);
        document.getElementById('chat-av').className        = 'chat-header-av';
        document.getElementById('chat-name').textContent     = title;
        document.getElementById('chat-sub').textContent      = 'Client: '+clientName;
        document.getElementById('general-notice').classList.remove('show');
        showChat();
        loadProjectMsgs(true);
        clearInterval(pollTimer);
        pollTimer = setInterval(function(){ loadProjectMsgs(false); }, 5000);
        renderThreads();
    }

    function showChat(){
        document.getElementById('placeholder').style.display    = 'none';
        var cc = document.getElementById('chat-content');
        cc.style.display='flex'; cc.style.flexDirection='column';
    }

    // Load general messages
    function loadGeneralMsgs(scroll){
        authFetch('/general-messages/client/'+activeId)
            .then(function(r){return r.json();})
            .then(function(data){ renderMsgs(data, scroll, 'general'); })
            .catch(function(){});
    }

    // Load project messages
    function loadProjectMsgs(scroll){
        authFetch('/messages/project/'+activeId)
            .then(function(r){return r.json();})
            .then(function(data){ renderMsgs(data, scroll, 'project'); })
            .catch(function(){});
    }

    function renderMsgs(data, scroll, type){
        var area = document.getElementById('msg-area');
        var prev = area.querySelectorAll('.msg-row').length;
        if(!scroll && prev===data.length) return;

        if(!data.length){
            area.innerHTML='<div class="chat-empty"><p>No messages yet</p></div>';
            return;
        }

        area.innerHTML='';
        var lastSender=null, lastDate=null;

        data.forEach(function(m){
            var senderId   = type==='general' ? m.senderId   : (m.sender ? m.sender.id : null);
            var senderName = type==='general' ? m.senderName : (m.senderName || 'Unknown');
            var isMe = senderName && senderName.toLowerCase().includes("admin");
            var dateLabel  = getDateLabel(m.timestamp);

            if(dateLabel!==lastDate){
                var sep=document.createElement('div'); sep.className='date-sep';
                sep.innerHTML='<span>'+dateLabel+'</span>';
                area.appendChild(sep);
                lastDate=dateLabel; lastSender=null;
            }
            var isConsec = lastSender===(isMe?'me':'them');
            lastSender = isMe?'me':'them';

            var row=document.createElement('div');
            row.className='msg-row '+(isMe?'me ':'')+(isConsec?'consec':'');
            row.innerHTML='<div class="msg-av '+(isMe?'me-av':'them-av')+'">'+initials(senderName)+'</div>'
                +'<div class="msg-wrap">'
                +'<span class="msg-sender">'+senderName+'</span>'
                +'<div class="msg-bubble">'+escHtml(m.content)+'</div>'
                +'<div class="msg-meta"><span class="msg-time">'+fmtTime(m.timestamp)+'</span>'
                +(isMe?'<span class="msg-tick">✓✓</span>':'')+'</div></div>';
            area.appendChild(row);
        });
        area.scrollTop=area.scrollHeight;
    }

    // Send message
    function sendMsg(){
        var input=document.getElementById('msg-input');
        var msg=input.value.trim();
        if(!msg||!activeId) return;
        var btn=document.getElementById('send-btn');
        btn.disabled=true;

        var fetchPromise;
        if(activeType==='general'){
            fetchPromise = authFetch('/general-messages',{
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({content:msg, senderId:user.id, clientId:activeId})
            });
        } else {
            fetchPromise = authFetch('/messages',{
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({content:msg, project:{id:activeId}, sender:{id:user.id}})
            });
        }

        fetchPromise
            .then(function(){ input.value=''; input.style.height='auto';
                if(activeType==='general') loadGeneralMsgs(true);
                else loadProjectMsgs(true);
            })
            .catch(function(){ alert('Failed to send.'); })
            .finally(function(){ btn.disabled=false; input.focus(); });
    }

    function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
    document.getElementById('msg-input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';});
    window.addEventListener('beforeunload',function(){clearInterval(pollTimer);});
</script>
</body>
</html>
